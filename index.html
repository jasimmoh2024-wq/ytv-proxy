<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amos TV</title>
    
    <script>window.startapp_app_id = "110183401";</script>
    <script src="https://startappcdn.com" async></script>
    
    <!-- مكتبة HLS الخفيفة جداً لتشغيل روابط البث -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #05070f; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
        
        .main-container { display: flex; width: 100vw; height: 100vh; position: relative; }
        
        /* شاشة عرض الفيديو */
        .video-box { flex: 1; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .welcome { position: absolute; color: #555; font-size: 13px; font-weight: bold; pointer-events: none; }

        /* قائمة القنوات الفورية النحيفة */
        .sidebar { 
            width: 150px; height: 100vh; background: #0c0e1a; 
            display: flex; flex-direction: column; border-left: 1px solid #1a1d36; z-index: 10;
        }
        .sidebar-header { font-size: 11px; color: #00ffff; font-weight: bold; text-align: center; padding: 8px 5px; border-bottom: 1px solid #1a1d36; }
        .list-wrapper { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
        
        .channel-item {
            background: #14172e; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; gap: 5px; cursor: pointer; height: 28px;
        }
        .channel-item.active { background: #00ffff; }
        .channel-item.active .title-box { color: #000; }
        .logo-box { width: 18px; height: 18px; background: #000; border-radius: 3px; display: flex; justify-content: center; align-items: center; font-size: 9px; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .title-box { font-size: 9px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; color: #fff; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-box">
            <div class="welcome" id="welcome">اختر قناة لبدء البث 🍿</div>
            <video id="tvVideo" controls autoplay playsinline></video>
        </div>

        <div class="sidebar">
            <div class="sidebar-header" id="status">جاري معالجة الملف...</div>
            <div class="list-wrapper" id="playlist"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('tvVideo');
        const welcome = document.getElementById('welcome');
        const status = document.getElementById('status');
        let channelsList = [];
        let hlsPlayer = null;

        // قراءة الملف مع حماية كاملة ضد الأخطاء البرمجية الناتجة عن التوكنات المعقدة
        fetch('channels.m3u')
            .then(res => res.text())
            .then(content => {
                const lines = content.split('\n');
                let currentName = '';
                let currentLogo = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.toUpperCase().startsWith('#EXTINF:')) {
                        // طريقة آمنة جداً لاستخراج الشعار دون حظر الكود
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/i) || line.match(/logo="([^"]+)"/i);
                        currentLogo = (logoMatch && logoMatch[1]) ? logoMatch[1].trim() : '';
                        
                        // طريقة ذكية للحصول على الاسم بعد الفاصلة الأخيرة دائماً تفادياً لتعقيد التوكنات
                        const commaIdx = line.lastIndexOf(',');
                        if (commaIdx !== -1) {
                            currentName = line.substring(commaIdx + 1).trim();
                        } else {
                            currentName = 'قناة بث مباشرة';
                        }
                    } else if (line.startsWith('http://') || line.startsWith('https://')) {
                        channelsList.push({
                            name: currentName || 'قناة بث مباشرة',
                            logo: currentLogo,
                            url: line
                        });
                        currentName = '';
                        currentLogo = '';
                    }
                }

                const container = document.getElementById('playlist');
                container.innerHTML = '';
                
                if (channelsList.length === 0) {
                    status.textContent = "لم يتم العثور على روابط داخل الملف ❌";
                    return;
                }

                // بناء القائمة فوراً وبسرعة البرق
                channelsList.forEach((ch, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    
                    const imgTag = ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎬';">` : '🎬';
                    
                    item.innerHTML = `
                        <div class="logo-box">${imgTag}</div>
                        <div class="title-box">${ch.name}</div>
                    `;
                    
                    item.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        playStream(index);
                    };
                    container.appendChild(item);
                });
                status.textContent = `القنوات (${channelsList.length}) 🎬`;
            })
            .catch((err) => {
                console.error(err);
                status.textContent = "خطأ في قراءة ملف channels.m3u ❌";
            });

        function playStream(index) {
            const channel = channelsList[index];
            welcome.style.display = 'none';
            
            if (typeof startapp !== 'undefined' && startapp.showAd) startapp.showAd();

            const streamUrl = channel.url;

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                hlsPlayer = new Hls({
                    enableWorker: true,
                    maxBufferLength: 10,
                    liveSyncDuration: 3
                });
                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(() => {});
            }
        }
    </script>
</body>
</html>
