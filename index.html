<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة الأفلام والقنوات الذكية</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "110183401"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        body { margin: 0; background: #060713; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        .header { background: #111322; padding: 12px; text-align: center; font-size: 16px; color: #00ffff; font-weight: bold; border-bottom: 2px solid #1f233a; }
        
        /* صندوق مشغل الفيديو الثابت في الأعلى */
        .player-header-area { width: 100%; height: 35vh; background: #000; display: flex; flex-direction: column; justify-content: center; position: relative; border-bottom: 2px solid #1f233a; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
        .status { padding: 8px; background: #111322; text-align: center; font-size: 11px; color: #888; font-weight: bold; border-top: 1px solid #1f233a; }

        /* ساحة العرض في الأسفل (نظام القائمة العمودية الموحدة) */
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        .playlist { width: 100%; background: #0b0c16; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px; }
        
        .channel-card {
            background: linear-gradient(135deg, #1a1d36, #141628); border: 1px solid #25294a;
            padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 12px; 
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: all 0.2s; width: 100%;
        }
        .channel-card:active, .channel-card.active { border-color: #00ffff; background: #1f233a; transform: scale(0.99); }
        
        /* حجم الشعار المصغر الأنيق جداً (42 بكسل) بناءً على طلبك */
        .ch-logo-wrapper { width: 42px; height: 42px; min-width: 42px; border-radius: 6px; background: #060713; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 18px; border: 1px solid #25294a; }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; }
        
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 13px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-meta-txt { font-size: 9px; color: #00ffcc; margin-top: 2px; }

        .loading-spinner { display: none; text-align: center; padding: 20px; font-size: 14px; font-weight: bold; color: #00ffff; width: 100%; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 1. شاشة المشغل المدمجة الثابتة في الأعلى -->
    <div class="player-header-area">
        <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
        <div class="status" id="status">اختر فيلماً أو قناة من الأسفل لبدء العرض الفوري 🍿</div>
    </div>
    
    <!-- 2. قائمة القنوات العمودية الموحدة في الأسفل بشعارات مصغرة -->
    <div class="main-content">
        <div class="loading-spinner" id="spinner">جاري سحب مكتبة الصور والعروض... ⏳</div>
        <div class="playlist" id="playlist">
            <!-- الكروت تولد هنا تلقائياً -->
        </div>
    </div>

    <script>
        const host = window.location.origin; 
        const videoElement = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');
        let channelsData = [];

        // جلب قائمة القنوات والبوسترات
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';

        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                spinner.style.display = 'none';
                
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171; width:100%;">مكتبتك فارغة تماماً حالياً</div>';
                    return;
                }
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                            <span class="ch-meta-txt">• اضغط للتغيير الفوري</span>
                        </div>
                    `;

                    card.onclick = () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
            })
            .catch(() => {
                spinner.style.display = 'none';
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center; width:100%;">خطأ في جلب البيانات من السيرفر المباشر</div>';
            });

        // معالج ومستقبل البث المدمج الذكي المحقون بالامتداد المزيف
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = `جاري الاتصال بالعرض: ${name} ... 🚀`;
            
            triggerHoneyPotAd();

            videoElement.removeAttribute('type');

            // 🌟 صناعة القناع المزيف: إلصاق امتداد وهمي في نهاية رابط البروكسي لخداع مشغل الميديا وجعله يفتح فوراً
            let fakeExtension = "video.mp4"; // الافتراضي لملفات الأفلام والروابط بدون امتداد
            if (url.toLowerCase().includes('.m3u8')) fakeExtension = "playlist.m3u8";

            // تركيب الرابط الجديد المتمم بالامتداد الوهمي
            const maskedProxyUrl = `${host}/stream/${fakeExtension}?url=${encodeURIComponent(url)}`;

            if (url.toLowerCase().includes('.m3u8')) {
                videoElement.type = 'application/x-mpegURL';
                videoElement.src = url; 
            } else if (!url.toLowerCase().includes('.mp4')) {
                videoElement.type = 'video/mp2t';
                videoElement.src = maskedProxyUrl; // تمرير رابط القناع المزيف لقنوات الـ Xtream
            } else {
                videoElement.src = maskedProxyUrl; // للأفلام وملفات الـ MP4
            }

            videoElement.load();
            
            videoElement.onplay = () => {
                statusText.textContent = `يعرض الآن: ${name}  ✅`;
            };

            videoElement.onerror = () => {
                statusText.textContent = `⚠️ تنبيه البث: سيعمل الفيديو فوراً وبدون أي مشكلة داخل التطبيق (APK) على الهواتف وموجهاً لـ ExoPlayer.`;
            };
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        });
    </script>
</body>
</html>
