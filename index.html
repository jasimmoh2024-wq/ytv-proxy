<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة السينما الحصرية الشفافة الصغيرة</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "110183401"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }

        /* منطقة الخلفية كاملة: تحولت لغرفة عرض سوداء سينمائية أنيقة لحين انطلاق البث */
        .video-background-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #060713; display: flex; justify-content: center; align-items: center; }
        .welcome-box { text-align: center; font-size: 13px; color: #444; font-weight: bold; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; display: flex; flex-direction: row; pointer-events: none; }

        /* 🌟 القائمة الجانبية المفضلة لديك: فائقة النحافة والصغر (18% فقط من الشاشة) ونقاء زجاجي كريستال ناصع جهة اليمين */
        .playlist-container { 
            width: 18%; max-width: 160px; height: 100vh; pointer-events: auto; 
            background: linear-gradient(to left, rgba(6, 7, 19, 0.95) 85%, rgba(0, 0, 0, 0)); 
            padding: 10px 5px; display: flex; flex-direction: column; gap: 6px; 
            border-left: 1px solid rgba(255, 255, 255, 0.02);
        }
        
        .header { font-size: 11px; color: #00ffff; font-weight: bold; text-align: center; text-shadow: 0 0 6px #00ffff; margin-bottom: 2px; }
        .status { text-align: center; font-size: 8px; color: #00ffcc; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; padding-left: 2px; }
        
        /* تصميم الكروت الزجاجية النحيفة والأنيقة */
        .channel-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3px 6px; border-radius: 5px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; width: 100%; height: 28px;
        }
        .channel-card:active, .channel-card.active { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 6px rgba(0,255,255,0.4); }
        
        /* تثبيت حجم الشعار الصغير جداً (22 بكسل) بقوة لمنع الاختفاء والضغط البصري */
        .ch-logo-wrapper { 
            width: 22px !important; height: 22px !important; min-width: 22px !important; max-width: 22px !important;
            border-radius: 3px; background: rgba(0,0,0,0.6); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 9px; border: 1px solid rgba(255,255,255,0.12); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 10px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-free-zone { flex: 1; height: 100vh; pointer-events: none; }
    </style>
</head>
<body>

    <!-- تم إلغاء عنصر الفيديو الداخلي المعطل برمجياً لكسر حظر المتصفحات الحتمية -->
    <div class="video-background-container">
        <div class="welcome-box" id="welcomeBox">ExoPlayer جاهز ومستعد للضخ 🍿</div>
    </div>
    
    <!-- طبقة الواجهة الشفافة فائقة النحافة والصغر جهة اليمين -->
    <div class="ui-layer">
        <div class="playlist-container">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">اختر باقة 🍿</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone"></div>
    </div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        let channelsData = [];

        // 1. جلب قائمة باقاتك وعرضها بالبوسترات
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                        </div>
                    `;

                    card.onclick = () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `جاهز لضخ البث.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:10px; color:#ef4444; text-align:center; font-size:10px;">خطأ خادم</div>';
            });

        // 2. معالج ومستقبل البث الحركي الموجه مباشرة لعناوين تشغيل الاندرويد الرسمية (Direct System Streaming)
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = "يتم تشغيل: " + name;
            
            // تفعيل الفخ الإعلاني فور النقر لتأمين أرباحك وحظر السارقين
            triggerHoneyPotAd();

            // تمرير الرابط المحدث والناجح الخاص بك عبر البروكسي لحل مشاكل الـ CORS 
            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;
            let finalStreamUrl = url.toLowerCase().includes('.m3u8') ? url : proxyUrl;

            // 🚀 السحر البرمجي لكسر حظر متصفح المنصة بشكل قطعي:
            // نقوم بفتح الرابط المباشر في نافذة حرة صلبة للتحميل الحي، الأندرويد والمنصة فوراً يكتشفان أن الرابط ينتهي بـ .ts
            // فيقوم الهاتف بإغلاق صفحة الويب صامتاً وفتح الفيديو مباشرة عبر مشغل النظام المدمج لـ (ExoPlayer) بملء الشاشة [2.38K]
            // تماماً بنفس القوة والثبات والسرعة التي تظهر لك في قسم الفيديو، وبأعلى استقرار [2.38K]!
            window.open(finalStreamUrl, '_blank');
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') { startapp.showInterstitial(); }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') { startapp.showInterstitial(); }
        });
    </script>
</body>
</html>
