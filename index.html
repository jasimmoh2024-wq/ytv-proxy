<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة السينما الاحترافية - Start.io</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        *{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
        .video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1}
        .video-background-container video{width:100%;height:100%;object-fit:contain}
        .ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;display:flex}
        .playlist-container{position:absolute;top:0;right:0;width:28%;max-width:320px;min-width:180px;height:100vh;background:rgba(10,10,15,0.85);backdrop-filter:blur(30px);padding:20px 12px;display:flex;flex-direction:column;gap:15px;border-left:2px solid rgba(255,0,60,0.2);z-index:5}
        .video-free-zone{width:72%;height:100vh;margin-right:auto;cursor:pointer}
        #startio-banner{position:fixed;bottom:0;left:0;width:100%;z-index:9999;text-align:center;background:rgba(0,0,0,0.9);padding:5px 0;min-height:50px}
    </style>
</head>
<body>
    <div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">جاري التحميل...</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    <div id="startio-banner"></div>
<script>
    const STARTIO_APP_ID = "209100049";
    window.startapp_app_id = STARTIO_APP_ID;
    // باقي كودك نفسه مع دالة الاعلان...
    function showInterstitialAd(){
        try{
            if(typeof startapp !== 'undefined' && startapp.showInterstitial){ startapp.showInterstitial(); return; }
            if(window.Android && window.Android.showInterstitial){ window.Android.showInterstitial(); return; }
        }catch(e){}
    }
</script>
<!-- الصق باقي سكربت القنوات هنا من ملفك القديم -->
</body>
</html>
