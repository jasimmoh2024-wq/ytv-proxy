<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة السينما الاحترافية الحمراء</title>
    
    <!-- استدعاء مكتبة Hls.js لتشغيل قنوات البث المباشر IPTV بكفاءة عالية -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        /* شاشة العرض السينمائية المدمجة ملء الشاشة */
        .video-background-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            background: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* عنصر الفيديو الفعلي */
        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* طبقة الواجهة الشفافة فوق الفيديو */
        .ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            display: flex; 
            flex-direction: row;
        }

        /* 🌟 القائمة الجانبية الاحترافية الزجاجية */
        .playlist-container { 
            position: absolute;
            top: 0;
            right: 0;
            width: 28% !important; 
            max-width: 320px !important; 
            min-width: 180px !important; 
            height: 100vh; 
            background: rgba(10, 10, 15, 0.75); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-left: 2px solid rgba(255, 0, 60, 0.2); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 1;
            z-index: 5;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.8);
            transform: translateX(0);
        }

        .playlist-container.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .video-free-zone { 
            width: 72%; 
            height: 100vh; 
            margin-right: auto; 
            pointer-events: auto; 
            cursor: pointer; 
        }
        
        .header { 
            font-size: 15px; 
            color: #ff003c; 
            font-weight: bold; 
            text-align: center; 
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.6); 
            letter-spacing: 1px;
        }
        
        .status { 
            text-align: center; 
            font-size: 10px; 
            color: #ff4d73; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        
        .playlist { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; padding-left: 2px; }
        
        /* 🎬 تصميم كروت القنوات الاحترافية */
        .channel-card {
            position: relative;
            background: rgba(20, 20, 25, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            width: 100%; 
            height: 50px;
            overflow: hidden;
        }
        
        .card-bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1; 
            z-index: 1;
            filter: blur(3px);
            transition: opacity 0.3s ease;
        }
        
        .channel-card-content { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; width: 100%; }
        .channel-card:hover { background: rgba(30, 30, 40, 0.8); border-color: rgba(255, 0, 60, 0.4); }
        .channel-card.active { border-color: #ff003c; background: rgba(255, 0, 60, 0.15); box-shadow: 0 0 12px rgba(255, 0, 60, 0.3); }
        .channel-card.active .card-bg-blur { opacity: 0.22; }
        
        .ch-logo-wrapper { 
            width: 32px !important; height: 32px !important; min-width: 32px !important; max-width: 32px !important;
            border-radius: 6px; background: rgba(0,0,0,0.5); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 12px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }
    </style>
</head>
<body>

    <!-- غرفة العرض السينمائية المدمجة المحتوية على مشغل الفيديو -->
    <div class="video-background-container" id="fullscreenBg">
        <video id="mainVideo" autoplay playsinline controls></video>
    </div>
    
    <!-- طبقة الواجهة الشفافة الفاخرة جهة اليمين -->
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">اختر باقة 🍿</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        const playlistContainer = document.getElementById('playlistContainer');
        const freeZone = document.getElementById('freeZone');
        const videoElement = document.getElementById('mainVideo');
        let channelsData = [];
        let hlsPlayer = null;
        
        // 🔒 قفل منع انطفاء الشاشة (Wake Lock)
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('تم تفعيل منع انطفاء الشاشة بنجاح 🌟');
                }
            } catch (err) {
                console.error(`Wake Lock Error: ${err.message}`);
            }
        }

        // دالة تشغيل القنوات الاحترافية المتكاملة
        function playChannel(channel) {
            statusText.textContent = `جاري تحميل: ${channel.name}`;
            
            // تحويل الرابط عبر البروكسي الخاص بسيرفر Render
            const streamUrl = `${host}/stream?url=${encodeURIComponent(channel.url)}`;

            // تنظيف أي بث سابق لمنع التداخل والتعليق
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            // تشغيل الرابط باستخدام تقنية HLS المتطورة
            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    maxBufferLength: 10,
                    liveDurationInfinity: true
                });
                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(videoElement);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoElement.play().catch(e => console.log("تحتاج لتفاعل المستخدم لبدء الصوت"));
                    statusText.textContent = `يعرض الآن: ${channel.name} 🎬`;
                });
                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        statusText.textContent = "خطأ في تشغيل القناة ❌";
                    }
                });
            } 
            // دعم هواتف آيفون ومتصفح Safari بشكل مباشر
            else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                videoElement.addEventListener('loadedmetadata', () => {
                    videoElement.play();
                    statusText.textContent = `يعرض الآن: ${channel.name} 🎬`;
                });
            } else {
                statusText.textContent = "المشغل غير مدعوم على هذا الجهاز ❌";
            }
        }

        // إعادة تفعيل قفل الشاشة تلقائياً
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // 1. جلب بيانات البث المباشر وقائمة القنوات
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                if(channels.length === 0) {
                    statusText.textContent = "قائمة القنوات فارغة ⚠️";
                    return;
                }
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';
                    
                    // 🛠️ تم إصلاح طريقة بناء النص (Template Literals) هنا لمنع اختفاء البيانات
                    card.innerHTML = `
                        ${logoUrl ? `<img src="\${logoUrl}" class="card-bg-blur" alt="bg">` : ''}
                        <div class="channel-card-content">
                            <div class="ch-logo-wrapper">${logoVisual}</div>
                            <div class="ch-info-box">
                                <span class="ch-title-name">${channel.name}</span>
                            </div>
                        </div>
                    `;

                    card.onclick = async (e) => {
                        e.stopPropagation(); 
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        
                        // تفعيل منع انطفاء الشاشة فوراً
                        await requestWakeLock();
                        
                        // استدعاء دالة التشغيل
                        playChannel(channel);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = "جاهز للعرض 🍿";
            })
            .catch(err => {
                statusText.textContent = "خطأ في تحميل القنوات ❌";
                console.error(err);
            });

        freeZone.onclick = () => {
            playlistContainer.classList.toggle('hidden');
        };
    </script>
</body>
</html>
