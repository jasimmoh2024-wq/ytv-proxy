<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مكتبة السينما الاحترافية</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.highperformanceformat.com/31813251/socialbar.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; font-family:'Cairo',system-ui}
html,body{
  margin:0;padding:0;
  background:#000;color:#fff;
  height:100%;height:100dvh;
  overflow:hidden;
  overscroll-behavior:none; /* منع الرفرش */
  overscroll-behavior-y:none;
  touch-action:pan-x pan-y;
  position:fixed; /* يمنع سحب الصفحة */
  width:100%;
}
.video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1}
video{width:100%;height:100%;object-fit:contain;background:#000}
.ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;display:flex;pointer-events:none}
.playlist-container{
  pointer-events:auto;
  position:absolute;top:0;right:0;width:42%!important;max-width:420px;min-width:320px;height:100vh;height:100dvh;
  background:linear-gradient(180deg, rgba(18,18,22,0.96) 0%, rgba(10,10,15,0.92) 100%);
  backdrop-filter:blur(25px);display:flex;flex-direction:column;
  border-left:2px solid rgba(255,0,60,0.4);transition:0.45s;z-index:5;
  overscroll-behavior:contain; /* القائمة تسحب داخلها فقط */
}
.playlist-container.hidden{transform:translateX(105%);opacity:0}
.video-free-zone{pointer-events:auto;width:58%;height:100vh;cursor:pointer}
.top-bar{padding:22px 20px 10px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.header{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.header span{color:#ff003c}
.status{font-size:11px;color:#ff4d73;background:rgba(255,0,60,0.1);padding:6px 10px;border-radius:20px;width:fit-content;border:1px solid rgba(255,0,60,0.2)}
.search-box{position:relative}
.search-box input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:11px 40px 11px 14px;color:#fff;outline:none;font-size:13px}
.search-box i{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:0.5}

/* القائمة - اهم تعديل لمنع الرفرش */
.playlist{
  display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;overflow-x:hidden;
  flex:1;padding:16px 14px 100px 14px;
  overscroll-behavior:contain; /* يمنع انتقال السحب للصفحة */
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}
.playlist::-webkit-scrollbar{width:4px}
.playlist::-webkit-scrollbar-thumb{background:#ff003c;border-radius:10px}

.channel-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:12px 14px;border-radius:14px;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:68px;transition:0.25s;touch-action:pan-y}
.channel-card:hover{background:rgba(255,255,255,0.07);transform:translateX(-3px);border-color:rgba(255,0,60,0.3)}
.channel-card.active{background:linear-gradient(90deg, rgba(255,0,60,0.2), rgba(255,0,60,0.08));border-color:#ff003c}
.ch-logo-wrapper{width:48px;height:48px;min-width:48px;border-radius:12px;background:linear-gradient(135deg,#111,#222);overflow:hidden;display:flex;justify-content:center;align-items:center;font-size:22px}
.ch-logo-img{width:100%;height:100%;object-fit:cover}
.ch-info{display:flex;flex-direction:column;gap:3px;flex:1;overflow:hidden}
.ch-title-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-subtitle{font-size:10px;color:rgba(255,255,255,0.45)}
.play-icon{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;justify-content:center;align-items:center;font-size:12px}
.open-btn{pointer-events:auto;position:fixed;top:20px;right:20px;z-index:10;background:rgba(10,10,15,0.85);border:1px solid rgba(255,0,60,0.4);color:#fff;padding:10px 18px;border-radius:30px;cursor:pointer;display:none;font-size:13px;font-weight:600}
.open-btn.show{display:flex;align-items:center;gap:8px}
#ad-fixed{position:fixed;bottom:0;left:0;width:100%;background:rgba(10,10,15,0.96);border-top:2px solid #ff003c;text-align:center;z-index:9999;padding:6px 0;min-height:65px;display:flex;justify-content:center;flex-direction:column}
@media(max-width:768px){.playlist-container{width:88%!important;min-width:auto}.video-free-zone{width:12%}}
</style>
</head>
<body>
<div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
<div class="open-btn" id="openBtn" onclick="togglePlaylist()">☰ القنوات</div>
<div class="ui-layer">
  <div class="playlist-container" id="playlistContainer">
    <div class="top-bar">
      <div class="header">📺 <span>مكتبة</span> السينما</div>
      <div class="status" id="status">جاري التحميل...</div>
      <div class="search-box"><i>🔍</i><input type="text" id="searchInput" placeholder="ابحث عن قناة..."></div>
    </div>
    <div class="playlist" id="playlist"></div>
  </div>
  <div class="video-free-zone" id="freeZone"></div>
</div>
<div id="ad-fixed"><div style="color:#ff003c;font-size:9px">إعلان</div>
<script>atOptions={'key':'31813462','format':'iframe','height':50,'width':320,'params':{}};</script>
<script src="https://www.highperformanceformat.com/31813462/invoke.js"></script></div>

<script>
// منع سحب الصفحة للرفرش
document.body.addEventListener('touchmove', function(e){
  if(e.target.closest('.playlist')) return; // اسمح بالسحب داخل القائمة فقط
  e.preventDefault();
}, {passive:false});

const API="https://ytv-proxy.onrender.com/api/channels";
const statusText=document.getElementById('status'), playlistDiv=document.getElementById('playlist'), playlistContainer=document.getElementById('playlistContainer'), openBtn=document.getElementById('openBtn'), video=document.getElementById('player'), searchInput=document.getElementById('searchInput');
let channelsData=[], filteredData=[], hls=null, currentIndex=-1;

function togglePlaylist(){ playlistContainer.classList.toggle('hidden'); openBtn.classList.toggle('show', playlistContainer.classList.contains('hidden')); document.getElementById('ad-fixed').style.display = playlistContainer.classList.contains('hidden') ? 'none' : 'flex'; }

fetch(API).then(r=>r.json()).then(channels=>{
  channelsData=channels; filteredData=channels;
  renderList(channels);
  statusText.textContent=`تم تحميل ${channels.length} قناة`;
});

function renderList(list){
  playlistDiv.innerHTML='';
  list.forEach((ch,idx)=>{
    let card=document.createElement('div'); card.className='channel-card';
    let logo=ch.logo ? `<img src="${ch.logo}" class="ch-logo-img" onerror="this.parentElement.innerHTML='🎬'">` : '🎬';
    card.innerHTML=`<div class="ch-logo-wrapper">${logo}</div><div class="ch-info"><span class="ch-title-name">${ch.name}</span><span class="ch-subtitle">بث مباشر • HD</span></div><div class="play-icon">▶</div>`;
    card.onclick=()=>{ currentIndex=idx; document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); play(ch); };
    playlistDiv.appendChild(card);
  });
}
function play(ch){
  statusText.textContent=ch.name;
  if(window.innerWidth<900){ playlistContainer.classList.add('hidden'); openBtn.classList.add('show'); document.getElementById('ad-fixed').style.display='none'; }
  if(hls){ hls.destroy(); hls=null; }
  if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(ch.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
  else { video.src=ch.url; video.play(); }
}
document.getElementById('freeZone').onclick=()=>togglePlaylist();
searchInput.addEventListener('input', (e)=>{
  let q=e.target.value.toLowerCase().trim();
  filteredData = !q ? channelsData : channelsData.filter(c=>c.name.toLowerCase().includes(q));
  renderList(filteredData);
});
</script>
</body>
</html>
