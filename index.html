<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مكتبة السينما الاحترافية</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>window.startapp_app_id="209100049";</script>
    <script src="https://startappcdn.com" async></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
        body{font-family:'Tajawal',system-ui;background:#050507;color:#fff;height:100vh;overflow:hidden}
        .video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;background:radial-gradient(ellipse at center,#1a1a22 0%,#000 70%)}
        .video-background-container video{width:100%;height:100%;object-fit:contain;background:#000}
        .show-menu-btn{position:fixed;top:20px;right:20px;z-index:10;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s}
        .show-menu-btn:hover{background:rgba(255,0,64,0.2);border-color:#ff0040}
        .ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:5;display:flex;pointer-events:none}
        .playlist-container{pointer-events:all;position:absolute;top:0;right:0;width:400px;max-width:90vw;height:100vh;background:rgba(10,10,15,0.96);backdrop-filter:blur(40px) saturate(180%);border-left:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;transition:transform 0.45s cubic-bezier(0.16,1,0.3,1);z-index:6;box-shadow:-20px 0 60px rgba(0,0,0,0.9)}
        .playlist-container.hidden{transform:translateX(100%)}
        .menu-header{padding:20px 16px 12px;background:linear-gradient(180deg,rgba(255,0,64,0.18) 0%,transparent 100%);border-bottom:1px solid rgba(255,255,255,0.06)}
        .menu-title{display:flex;align-items:center;justify-content:space-between}
        .menu-title h2{font-size:21px;font-weight:800;display:flex;gap:10px;align-items:center}
        .menu-title h2 span{color:#ff0040}
        .close-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .search-box{margin-top:14px;position:relative}
        .search-box input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:10px 38px 10px 12px;color:#fff;font-family:'Tajawal';outline:none;transition:0.2s}
        .search-box input:focus{border-color:#ff0040;background:rgba(255,255,255,0.09)}
        .search-box i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#888}
        .status-line{margin-top:12px;font-size:12px;color:#ff8da8;background:rgba(255,0,64,0.1);border:1px solid rgba(255,0,64,0.15);padding:7px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
        .playlist{flex:1;overflow-y:auto;padding:14px 12px 90px;display:flex;flex-direction:column;gap:10px}
        .playlist::-webkit-scrollbar{width:4px}
        .playlist::-webkit-scrollbar-thumb{background:rgba(255,0,64,0.3);border-radius:10px}
        /* الكارد الجديد المحسن */
        .channel-card{position:relative;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:10px 12px;border-radius:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.25s ease}
        .channel-card:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12);transform:translateY(-1px)}
        .channel-card.active{background:linear-gradient(135deg,rgba(255,0,64,0.28) 0%,rgba(255,0,64,0.12) 100%);border-color:#ff0040;box-shadow:0 8px 25px rgba(255,0,64,0.25)}
        .ch-logo-wrapper{width:56px;height:56px;min-width:56px;border-radius:14px;background:#fff;overflow:hidden;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,255,255,0.12);position:relative;padding:4px}
        .ch-logo-img{width:100%;height:100%;object-fit:contain; /* اهم تعديل */}
        .live-dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;background:#00ff88;border-radius:50%;border:2px solid #101014;box-shadow:0 0 10px #00ff88}
        .ch-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
        .ch-title-name{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.2px}
        .ch-meta{font-size:11px;color:#aaa;display:flex;gap:6px;align-items:center}
        .ch-meta .badge{background:rgba(0,255,136,0.12);color:#00ff88;border:1px solid rgba(0,255,136,0.2);padding:2px 8px;border-radius:20px;font-size:10px}
        .play-icon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;transition:0.25s;flex-shrink:0}
        .channel-card:hover .play-icon{background:#ff0040;color:#fff}
        .channel-card.active .play-icon{background:#ff0040}
        .video-free-zone{width:100%;height:100vh;cursor:pointer;pointer-events:all}
        #adsterra-banner-fixed{position:fixed;bottom:0;left:0;width:100%;height:50px;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:999999;display:flex;justify-content:center;align-items:center;border-top:1px solid rgba(255,0,64,0.2);}
        @media(max-width:600px){
            .playlist-container{width:100%;max-width:100vw}
            .show-menu-btn{top:auto;bottom:70px;right:16px;width:56px;height:56px;border-radius:18px;background:#ff0040;box-shadow:0 8px 25px rgba(255,0,64,0.4)}
        }
    </style>
</head>
<body>
    <div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
    <div class="show-menu-btn" id="showBtn"><i class="fa-solid fa-bars-staggered"></i></div>
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="menu-header">
                <div class="menu-title">
                    <h2><i class="fa-solid fa-tv" style="color:#ff0040"></i> مكتبة <span>السينما</span></h2>
                    <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="searchInput" placeholder="ابحث عن قناة..."></div>
                <div class="status-line" id="status"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل...</div>
            </div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    <div id="adsterra-banner-fixed"></div>
<script>
    const host = window.location.origin;
    const statusText = document.getElementById('status');
    const playlistContainer = document.getElementById('playlistContainer');
    const freeZone = document.getElementById('freeZone');
    const video = document.getElementById('player');
    const searchInput = document.getElementById('searchInput');
    let channelsData = [], hls = null, wakeLock = null;
    let channelClicks = parseInt(localStorage.getItem('ad_clicks') || '0');

    async function requestWakeLock(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
    document.addEventListener('visibilitychange', async()=>{ if(wakeLock!==null && document.visibilityState==='visible') await requestWakeLock(); });

    let bannerDiv = document.getElementById('adsterra-banner-fixed');
    let atOptions = { 'key' : 'a0c5287b15523633a4188d2ccd6d4241', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    let s1 = document.createElement('script');
    s1.src = "https://www.highperformanceformat.com/a0c5287b15523633a4188d2ccd6d4241/invoke.js";
    bannerDiv.appendChild(s1);

    document.getElementById('closeBtn').onclick = ()=> playlistContainer.classList.add('hidden');
    document.getElementById('showBtn').onclick = ()=> playlistContainer.classList.remove('hidden');
    freeZone.onclick = ()=> playlistContainer.classList.remove('hidden');

    function renderChannels(filter=''){
        const playlistDiv=document.getElementById('playlist');
        playlistDiv.innerHTML='';
        const filtered = channelsData.filter(c=> c.name.toLowerCase().includes(filter.toLowerCase()));
        filtered.forEach((channel)=>{
            const realIdx = channelsData.indexOf(channel);
            const card=document.createElement('div');
            card.className='channel-card';
            let logoUrl=channel.logo||"";
            let logoVisual=logoUrl?`<img src="${logoUrl}" class="ch-logo-img" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='🎬'"><div class="live-dot"></div>`:'🎬';
            card.innerHTML=`
                <div class="ch-logo-wrapper">${logoVisual}</div>
                <div class="ch-info">
                    <span class="ch-title-name">${channel.name}</span>
                    <div class="ch-meta"><span class="badge">مباشر HD</span> <i class="fa-solid fa-satellite-dish" style="color:#ff0040"></i> LIVE</div>
                </div>
                <div class="play-icon"><i class="fa-solid fa-play" style="font-size:12px;margin-left:2px"></i></div>
            `;
            card.onclick=()=>{ document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); playChannel(realIdx); };
            playlistDiv.appendChild(card);
        });
    }

    fetch(`${host}/api/channels`).then(r=>r.json()).then(channels=>{
        channelsData=channels;
        renderChannels();
        statusText.innerHTML = `<i class="fa-solid fa-check" style="color:#00ff88"></i> تم تحميل ${channels.length} قناة`;
        searchInput.addEventListener('input', (e)=> renderChannels(e.target.value));
    });

    function playChannel(idx){
        channelClicks++; localStorage.setItem('ad_clicks', channelClicks);
        if(channelClicks >= 4){
            let s2 = document.createElement('script');
            s2.src = "https://czernik.org/14/2dad716486cfb2031892dd6423eca662/invoke.js";
            document.body.appendChild(s2);
            channelClicks = 0; localStorage.setItem('ad_clicks', '0');
        }
        const channel=channelsData[idx];
        statusText.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:#ff0040"></i> ${channel.name}`;
        playlistContainer.classList.add('hidden');
        requestWakeLock();
        if(typeof startapp!=='undefined'){ try{ startapp.showInterstitial(); }catch(e){} }
        const url=channel.url;
        if(hls){ hls.destroy(); hls=null; }
        if(Hls.isSupported()){
            hls=new Hls({enableWorker:true, lowLatencyMode:true});
            hls.loadSource(url); hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
        } else{ video.src=url; video.play(); }
    }
</script>
</body>
</html>
