<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مكتبة السينما الاحترافية</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>window.startapp_app_id="209100049";</script>
    <script src="https://startappcdn.com" async></script>
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{margin:0;padding:0;background:radial-gradient(circle at 50% 20%, #23233a 0%, #12121c 60%, #0a0a12 100%);color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
        .video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;background:transparent}
        .video-background-container video{width:100%;height:100%;object-fit:contain;background:transparent}
        .ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;display:flex}
        .playlist-container{position:absolute;top:0;right:0;width:32%!important;max-width:360px!important;min-width:260px!important;height:100vh;background:rgba(18,18,28,0.92);backdrop-filter:blur(30px);padding:16px 10px;display:flex;flex-direction:column;gap:12px;border-left:2px solid rgba(255,0,60,0.2);transition:transform 0.4s ease,opacity 0.4s;z-index:5;padding-bottom:70px}
        .playlist-container.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
        .video-free-zone{width:68%;height:100vh;margin-right:auto;cursor:pointer}
        .header{font-size:15px;color:#ff003c;font-weight:bold;text-align:center}
        .status{text-align:center;font-size:11px;color:#ff4d73;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .playlist{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
        .channel-card{position:relative;background:#fff;border:1px solid #e5e5e5;padding:0 12px;border-radius:14px;display:flex;align-items:center;height:84px;min-height:84px;cursor:pointer;width:100%}
        .channel-card.active{border-color:#ff003c;background:#111}
        .channel-card.active .ch-title-name{color:#fff}
        .channel-card-content{display:flex;align-items:center;gap:12px;width:100%}
        .ch-logo-wrapper{width:60px!important;height:60px!important;min-width:60px!important;border-radius:12px;background:#fff;border:1px solid #eee;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:6px}
        .ch-logo-img{width:100%;height:100%;object-fit:contain!important}
        .ch-title-name{font-size:14px;font-weight:800;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #adsterra-banner-fixed{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#11101a;z-index:99999;display:flex;justify-content:center;align-items:center;border-top:1px solid rgba(255,255,255,0.08)}
    </style>
</head>
<body>
    <div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">جاري التحميل...</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    <div id="adsterra-banner-fixed">
        <script> atOptions = { 'key' : 'a0c5287b15523633a4188d2ccd6d4241', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} }; </script>
        <script src="https://czernik.org/22/a0c5287b15523633a4188d2ccd6d4241"></script>
    </div>
<script>
    const host = window.location.origin;
    const statusText = document.getElementById('status');
    const playlistContainer = document.getElementById('playlistContainer');
    const freeZone = document.getElementById('freeZone');
    const video = document.getElementById('player');
    let channelsData = [], hls = null;
    function showBarAd(){
        let old = document.getElementById('bar-ad-script');
        if(old) old.remove();
        var barScript = document.createElement('script');
        barScript.id = 'bar-ad-script';
        barScript.setAttribute('data-cfasync', 'false');
        barScript.src = 'https://czernik.org/14/2dad716486cfb2031892dd6423eca662';
        document.body.appendChild(barScript);
    }
    fetch(`${host}/api/channels`).then(r=>r.json()).then(channels=>{
        channelsData=channels;
        const playlistDiv=document.getElementById('playlist');
        playlistDiv.innerHTML='';
        channels.forEach((channel,idx)=>{
            const card=document.createElement('div');
            card.className='channel-card';
            let logoUrl=channel.logo||"";
            let logoVisual=logoUrl?`<img src="${logoUrl}" class="ch-logo-img" onerror="this.parentElement.innerHTML='🎬'">`:'🎬';
            card.innerHTML=`<div class="channel-card-content"><div class="ch-logo-wrapper">${logoVisual}</div><span class="ch-title-name">${channel.name}</span></div>`;
            card.onclick=(e)=>{ e.stopPropagation(); document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); playChannel(idx); };
            playlistDiv.appendChild(card);
        });
        statusText.textContent=`تم تحميل ${channels.length} قناة`;
    });
    function playChannel(idx){
        showBarAd();
        const channel=channelsData[idx];
        statusText.textContent=channel.name;
        playlistContainer.classList.add('hidden');
        if(typeof startapp!=='undefined'){ try{ startapp.showInterstitial(); }catch(e){} }
        const url=channel.url;
        if(hls){ hls.destroy(); hls=null; }
        if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
        else{ video.src=url; video.play(); }
    }
    freeZone.onclick=(e)=>{ e.stopPropagation(); playlistContainer.classList.remove('hidden'); };
</script>
</body>
</html>
