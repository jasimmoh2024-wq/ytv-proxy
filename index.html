<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل القنوات الذكي</title>
    <!-- استدعاء مشغل الفيديو الاحترافي -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; margin: 0; padding: 20px; }
        .player-container { display: flex; flex-direction: column; max-width: 800px; margin: auto; }
        video { width: 100%; border-radius: 8px; background: black; }
        .notice { text-align: center; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="player-container">
    <h2 style="text-align: center;">جاري تشغيل خادم البث المستقر...</h2>
    
    <!-- المشغل الرقمي المتطور لقنوات الـ HLS/M3U8 -->
    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay preload="auto" data-setup='{}'>
        <!-- هنا يقوم السيرفر بتحميل القناة الأولى تلقائياً من البروكسي الداخلي -->
        <source src="/playlist" type="application/x-mpegURL">
    </video>
</div>

<p class="notice">تم الاتصال بالسيرفر السحابي بنجاح. إذا توقف البث قم بإعادة تحديث الصفحة.</p>

<script src="https://zencdn.net"></script>
</body>
</html>
