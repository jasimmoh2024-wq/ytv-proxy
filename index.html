<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة السينما</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>window.startapp_app_id="209100049";</script>
<script src="https://startappcdn.com" async></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#23233e!important;height:100vh;overflow:hidden}
.video-background-container{position:absolute;inset:0;z-index:1;background:#23233e!important}
.video-background-container video{width:100%;height:100%;object-fit:contain;background:transparent!important}
#btn-show-list{position:fixed;top:14px;left:14px;z-index:1000;background:#ff003c;color:#fff;border:none;width:50px;height:50px;border-radius:14px;font-size:24px;cursor:pointer;box-shadow:0 4px 15px rgba(255,0,60,.5)}
#btn-close{position:fixed;top:14px;right:14px;z-index:1000;background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.2);width:50px;height:50px;border-radius:14px;font-size:22px;cursor:pointer}
.playlist-container{position:absolute;top:0;right:0;width:360px!important;max-width:90vw;height:100vh;background:rgba(32,32,55,.98)!important;backdrop-filter:blur(20px);padding:18px 12px;display:flex;flex-direction:column;gap:14px;z-index:5;transition:.35s ease;padding-bottom:70px;border-left:1px solid rgba(255,255,255,.08)}
.playlist-container.hidden{transform:translateX(110%)}
.playlist{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1}
.channel-card{background:#fff!important;border-radius:18px!important;height:84px!important;min-height:84px!important;display:flex;align-items:center;padding:0 14px!important;cursor:pointer;width:100%!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important}
.channel-card.active{background:#0f0f0f!important;border:2px solid #ff003c!important}
.channel-card.active .ch-title-name{color:#fff!important}
.ch-logo-wrapper{width:62px!important;height:62px!important;min-width:62px!important;border-radius:14px!important;background:#fff!important;padding:7px!important;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ch-logo-img{width:100%!important;height:100%!important;object-fit:contain!important}
.ch-title-name{font-size:14px;font-weight:800;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#adsterra-banner-fixed{position:fixed;bottom:0;left:0;width:100%;height:62px;background:#0a0a14!important;z-index:99999;display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<button id="btn-show-list">☰</button>
<button id="btn-close">✕</button>
<div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
<div class="playlist-container" id="playlistContainer">
<div style="text-align:center;color:#fff;font-weight:900">📺 قائمة القنوات</div>
<div id="status" style="text-align:center;font-size:11px;color:#ff5a7a">تحميل...</div>
<div class="playlist" id="playlist"></div>
</div>
<div id="adsterra-banner-fixed"><script>atOptions={'key':'a0c5287b15523633a4188d2ccd6d4241','format':'iframe','height':50,'width':320,'params':{}};</script><script src="https://czernik.org/22/a0c5287b15523633a4188d2ccd6d4241"></script></div>
<script>
const host=location.origin;const pc=document.getElementById('playlistContainer');const video=document.getElementById('player');let channelsData=[],hls=null;
function showBarAd(){let o=document.getElementById('bar-ad-script');if(o)o.remove();var s=document.createElement('script');s.id='bar-ad-script';s.setAttribute('data-cfasync','false');s.src='https://czernik.org/14/2dad716486cfb2031892dd6423eca662';document.body.appendChild(s);}
document.getElementById('btn-show-list').onclick=(e)=>{e.stopPropagation();pc.classList.remove('hidden')};
document.getElementById('btn-close').onclick=()=>{video.pause();pc.classList.remove('hidden')};
fetch(`${host}/api/channels`).then(r=>r.json()).then(channels=>{channelsData=channels;const pl=document.getElementById('playlist');pl.innerHTML='';channels.forEach((c,i)=>{const card=document.createElement('div');card.className='channel-card';let lg=c.logo?`<img src="${c.logo}" class="ch-logo-img" onerror="this.parentElement.innerHTML='🎬'">`:'🎬';card.innerHTML=`<div style="display:flex;gap:14px;align-items:center;width:100%"><div class="ch-logo-wrapper">${lg}</div><span class="ch-title-name">${c.name}</span></div>`;card.addEventListener('click',()=>{document.querySelectorAll('.channel-card').forEach(x=>x.classList.remove('active'));card.classList.add('active');playChannel(i)});pl.appendChild(card)});document.getElementById('status').textContent=`تم تحميل ${channels.length} قناة`;if(channels.length>0){document.querySelector('.channel-card').classList.add('active');playChannel(0)}});
function playChannel(i){if(!channelsData[i])return;showBarAd();const ch=channelsData[i];document.getElementById('status').textContent=ch.name;pc.classList.add('hidden');if(typeof startapp!=='undefined'){try{startapp.showInterstitial()}catch(e){}}const url=ch.url;if(hls){hls.destroy();hls=null}if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}))}else{video.src=url;video.play().catch(()=>{})}}
</script>
</body>
</html>
