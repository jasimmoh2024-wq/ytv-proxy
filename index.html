<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amos TV</title>
    
    <script>window.startapp_app_id = "110183401";</script>
    <script src="https://startappcdn.com" async></script>
    
    <!-- استخدام مكتبة هادئة وخفيفة جداً لضمان عدم تجميد الـ WebView -->
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #020208; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
        
        .main-container { display: flex; width: 100vw; height: 100vh; position: relative; }
        
        /* شاشة عرض الفيديو الحية */
        .video-box { flex: 1; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .welcome { position: absolute; color: #444; font-size: 13px; font-weight: bold; pointer-events: none; text-align: center; }

        /* القائمة الجانبية فائقة السرعة والخفة */
        .sidebar { 
            width: 160px; height: 100vh; background: #090a14; 
            display: flex; flex-direction: column; border-left: 1px solid #14162e; z-index: 10;
        }
        .sidebar-header { font-size: 12px; color: #00ffff; font-weight: bold; text-align: center; padding: 10px 5px; border-bottom: 1px solid #14162e; }
        .list-wrapper { flex: 1; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
        
        .channel-item {
            background: #101226; padding: 4px 6px; border-radius: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; height: 32px; border: 1px solid transparent;
        }
        .channel-item.active { border-color: #00ffff; background: #152c42; }
        .logo-box { width: 22px; height: 22px; background: #000; border-radius: 3px; display: flex; justify-content: center; align-items: center; font-size: 10px; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .title-box { font-size: 10px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: right; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- مساحة عرض الفيديو -->
        <div class="video-box">
            <div class="welcome" id="welcome">اختر قناة لبدء العرض 🍿</div>
            <video id="tvVideo" controls autoplay playsinline></video>
        </div>

        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="sidebar-header" id="status">Amos TV 🎬</div>
            <div class="list-wrapper" id="playlist"></div>
        </div>
    </div>

    <script>
        const host = window.location.origin;
        const video = document.getElementById('tvVideo');
        const welcome = document.getElementById('welcome');
        const status = document.getElementById('status');
        let channelsList = [];
        let hlsPlayer = null;

        // جلب القنوات بشكل فوري بفضل الـ Cache في السيرفر
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(data => {
                channelsList = data;
                const container = document.getElementById('playlist');
                container.innerHTML = '';
                
                data.forEach((ch, index) => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.id = `ch-${index}`;
                    
                    const imgTag = ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none'; this.parentElement.innerHTML='🎬';">` : '🎬';
                    
                    item.innerHTML = `
                        <div class="logo-box">${imgTag}</div>
                        <div class="title-box">${ch.name}</div>
                    `;
                    
                    item.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                        item.classList.add('active');
                        playStream(index);
                    };
                    container.appendChild(item);
                });
                status.textContent = `القنوات (${data.length}) 📺`;
            })
            .catch(() => {
                status.textContent = "خطأ في الاتصال ❌";
            });

        function playStream(index) {
            const channel = channelsList[index];
            welcome.style.display = 'none';
            
            if (typeof startapp !== 'undefined' && startapp.showAd) startapp.showAd();

            // استخدام مسار البروكسي لإعادة التوجيه الآمن وتخطي الـ CORS
            const streamUrl = `${host}/stream?url=${encodeURIComponent(channel.url)}`;

            if (Hls.isSupported()) {
                if (hlsPlayer) hlsPlayer.destroy();
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsPlayer.loadSource(streamUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.play().catch(() => {});
            }
        }
    </script>
</body>
</html>
