<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قنواتي IPTV</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background: #0b0b0b; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #141414; padding: 15px; text-align: center; font-size: 18px; color: #4ade80; border-bottom: 1px solid #222; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .playlist { width: 30%; max-width: 320px; background: #111; overflow-y: auto; border-left: 1px solid #222; }
        .channel-item { padding: 12px 15px; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: 0.2s; font-size: 14px; text-align: right; }
        .channel-item:hover { background: #1c1c1c; color: #4ade80; }
        .player-area { width: 70%; flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; position: relative; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; }
        .status { padding: 12px; background: #111; text-align: center; font-size: 13px; color: #888; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">📺 مشغل قنوات IPTV المتكامل</div>
    
    <div class="main-content">
        <!-- القائمة الجانبية -->
        <div class="playlist" id="playlist">
            <div style="padding:20px; text-align:center; color:#888;">جاري جلب القنوات وفك التشفير...</div>
        </div>
        
        <!-- مشغل الفيديو -->
        <div class="player-area">
            <video id="videoPlayer" controls autoplay playsinline></video>
            <div class="status" id="status">اختر قناة من القائمة الجانبية لبدء المشاهدة</div>
        </div>
    </div>

    <script>
        const host = window.location.origin;
        const videoElement = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');
        let playerInstance = null;

        // 1. جلب قائمة القنوات تلقائياً عند فتح الصفحة
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                const playlistDiv = document.getElementById('playlist');
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">الملف فارغ أو لم يتم التعرف على الروابط</div>';
                    return;
                }
                
                playlistDiv.innerHTML = ''; // مسح جملة التحميل
                
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.textContent = channel.name;
                    item.onclick = () => playChannel(channel.url, channel.name);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم تحميل ${channels.length} قناة بنجاح. اختر قناة للتشغيل.`;
            })
            .catch((err) => {
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">خطأ في الاتصال بالملف الداخلي</div>';
            });

        // 2. معالج تشغيل البث الحي
        function playChannel(url, name) {
            statusText.textContent = `جاري الاتصال بالقناة المباشرة: ${name} ...`;
            statusText.style.color = "#38bdf8";
            
            if (playerInstance) {
                playerInstance.destroy();
            }

            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;

            if (mpegts.getFeatureList().mseLivePlayback) {
                playerInstance = mpegts.createPlayer({ type: 'mse', isLive: true, url: proxyUrl });
                playerInstance.attachMediaElement(videoElement);
                playerInstance.load();
                
                playerInstance.on(mpegts.Events.INFO, () => {
                    statusText.textContent = `يعرض الآن: ${name} ✅`;
                    statusText.style.color = "#4ade80";
                });
                
                playerInstance.on(mpegts.Events.ERROR, () => {
                    statusText.textContent = `❌ تعذر تشغيل (${name}). قد تكون القناة متوقفة مؤقتاً.`;
                    statusText.style.color = "#f87171";
                });

                videoElement.play().catch(() => {
                    statusText.textContent = `💡 انقر تشغيل وسط الشاشة لعرض القناة: ${name}`;
                });
            }
        }
    </script>
</body>
</html>
