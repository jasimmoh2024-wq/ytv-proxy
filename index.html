<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍿 سينما  - مكتبة الأفلام الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #000000; padding: 18px; text-align: center; font-size: 20px; color: #e50914; border-bottom: 2px solid #222; font-weight: bold; }
        
        .main-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        
        /* منطقة مشغل ExoPlayer المدمج الذكي */
        .player-area { width: 100%; background: #000; display: flex; justify-content: center; align-items: center; aspect-ratio: 16/9; border-bottom: 1px solid #222; }
        video { width: 100%; height: 100%; background: #000; max-height: 240px; }
        
        /* قائمة الأفلام */
        .playlist { width: 100%; background: #181818; overflow-y: auto; padding: 12px; flex: 1; }
        .movie-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; background: #2f2f2f; cursor: pointer; transition: all 0.2s ease; border: 1px solid #3c3c3c; }
        .movie-item:hover { background: #3e3e3e; border-color: #e50914; }
        .movie-info { display: flex; align-items: center; gap: 15px; }
        
        /* بوستر الفيلم */
        .movie-logo { width: 45px; height: 60px; border-radius: 4px; object-fit: cover; background: #000; border: 1px solid #e50914; }
        .movie-name { font-size: 15px; font-weight: 600; color: #f5f5f7; text-align: right; }
        .play-badge { background: #e50914; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        
        /* حاويات إعلانات Adsterra المخصصة */
        .ad-container { width: 100%; text-align: center; background: #000; padding: 6px 0; border-bottom: 1px solid #222; display: flex; justify-content: center; align-items: center; }
        .ad-bottom { border-top: 1px solid #222; border-bottom: none; }
        
        .status { padding: 14px; background: #000000; text-align: center; font-size: 13px; color: #aaa; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">🍿 مكتبة الفديوات الذكية</div>
    
    <!-- منطقة مشغل الفيديو الأصلي المدعوم ببرمجيات ExoPlayer للهاتف تلقائياً -->
    <div class="player-area">
        <video id="exoVideoPlayer" controls poster="https://lo1.in" playsinline preload="auto"></video>
    </div>

    <!-- 1. مساحة إعلانية علوية (تظهر بين المشغل وقائمة الأفلام) -->
    <div class="ad-container" id="ad-top-slot">
        <!-- 🔴 الصق كود إعلان Adsterra (الـ Native Banner أو 728x90) هنا -->
        <span style="color:#444; font-size:11px;">إعلان مدفوع الأجر</span>
    </div>

    <div class="main-content">
        <div class="playlist" id="moviePlaylist">
            <div style="padding:30px; text-align:center; color:#888;">جاري جلب مكتبة الأفلام والبوسترات...</div>
        </div>
    </div>

    <!-- 2. مساحة إعلانية سفلية -->
    <div class="ad-container ad-bottom" id="ad-bottom-slot">
        <!-- 🔴 الصق كود إعلان Adsterra الثاني هنا -->
        <span style="color:#444; font-size:11px;">إعلان مدفوع الأجر</span>
    </div>

    <div class="status" id="statusText">اختر فيلماً من القائمة لبدء المشاهدة الفورية</div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('statusText');
        const videoPlayer = document.getElementById('exoVideoPlayer');

        // 1. جلب قائمة الأفلام والبوسترات من السيرفر الخلفي ديناميكياً
        fetch(`${host}/api/movies`)
            .then(res => res.json())
            .then(movies => {
                const playlistDiv = document.getElementById('moviePlaylist');
                if(movies.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">مكتبة الأفلام فارغة حالياً</div>';
                    return;
                }
                
                playlistDiv.innerHTML = '';
                
                movies.forEach(movie => {
                    const item = document.createElement('div');
                    item.className = 'movie-item';
                    
                    const posterImg = movie.logo ? movie.logo : 'https://lo1.in';
                    
                    item.innerHTML = `
                        <div class="movie-info">
                            <img class="movie-logo" src="${posterImg}" onerror="this.src='https://lo1.in';">
                            <span class="movie-name">${movie.name}</span>
                        </div>
                        <span class="play-badge">مشاهدة 🎬</span>
                    `;
                    
                    // عند الضغط يتم تشغيل الفيلم داخل المشغل المدمج فوراً
                    item.onclick = () => startMoviePlayback(movie.url, movie.name, posterImg);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم تحميل ${movies.length} فيلم بنجاح داخل المكتبة.`;
            })
            .catch(() => {
                document.getElementById('moviePlaylist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">خطأ في الاتصال بخادم الأفلام</div>';
            });

        // 2. دالة تشغيل الفيلم فوراً وسلاسة بدون مشغلات خارجية
        function startMoviePlayback(videoUrl, name, poster) {
            statusText.textContent = `جاري تشغيل فيلم: ${name}...`;
            
            // تحديث بوستر ومصدر المشغل الداخلي
            videoPlayer.poster = poster;
            videoPlayer.src = videoUrl;
            videoPlayer.load();
            
            // تشغيل تلقائي
            videoPlayer.play()
                .then(() => {
                    statusText.textContent = `يعرض الآن 🍿: ${name}`;
                })
                .catch(() => {
                    statusText.textContent = `اضغط على زر التشغيل لبدء الفيلم: ${name}`;
                });
        }
    </script>
</body>
</html>
