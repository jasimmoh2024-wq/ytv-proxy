<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 مشغل قنوات Netflix & VIP - ExoPlayer</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --bg-header: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-color: rgba(56, 189, 248, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            margin: 0; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        .header { 
            background: linear-gradient(135deg, var(--bg-header), var(--bg-main));
            padding: 18px; 
            text-align: center; 
            font-size: 20px; 
            color: var(--accent-color); 
            border-bottom: 2px solid #223147; 
            font-weight: 800; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-shadow: 0 0 8px var(--glow-color);
        }
        
        .main-content { 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            overflow: hidden; 
        }
        
        .playlist { 
            width: 100%; 
            background: var(--bg-main); 
            overflow-y: auto; 
            padding: 14px; 
            flex: 1; 
        }

        /* تصميم كروت القنوات بشكل خرافي وعرض شعار أنيق */
        .channel-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 16px; 
            margin-bottom: 10px; 
            border-radius: 14px; 
            background: var(--bg-card); 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid #223147; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .channel-item:hover { 
            background: #1e2d4a; 
            border-color: var(--accent-color); 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--glow-color);
        }

        .channel-info { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        
        /* أبعاد اللوجو بشكل طولي فخم ومتناسق */
        .channel-logo { 
            width: 50px; 
            height: 65px; 
            border-radius: 8px; 
            object-fit: cover; 
            background: #111b2b; 
            border: 1px solid #334563; 
            display: block; 
        }

        .channel-name { 
            font-size: 15px; 
            font-weight: 600; 
            color: #f1f5f9; 
            text-align: right; 
        }

        .play-badge { 
            background: linear-gradient(135deg, #0ea5e9, #38bdf8); 
            color: #0f172a; 
            padding: 7px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }
        
        /* مساحات إعلانية معزولة بالكامل لحقن أكواد Adsterra */
        .adsterra-box { 
            width: 100%; 
            min-height: 65px;
            text-align: center; 
            background: #060912; 
            padding: 6px 0; 
            border-bottom: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
        }
        .ad-bottom { border-top: 1px solid #1e293b; border-bottom: none; }
        .ad-title { color: #475569; font-size: 10px; margin-bottom: 2px; font-weight: bold; }
        
        .status { 
            padding: 12px; 
            background: #111827; 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-secondary); 
            border-top: 1px solid #1e293b; 
        }
    </style>
</head>
<body>

    <div class="header">📺 مشغل قنوات Netflix & VIP</div>
    
    <!-- 🌐 مساحة إعلانية علوية جاهزة لحقن سكربت Adsterra -->
    <div class="adsterra-box" id="ad-top">
        <div class="ad-title">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الإعلاني هنا مستقبلاً -->
    </div>

    <div class="main-content">
        <div class="playlist" id="playlist">
            <div style="padding:20px; text-align:center; color:var(--text-secondary);">جاري سحب مستودع القنوات الذكي...</div>
        </div>
    </div>

    <!-- 🌐 مساحة إعلانية سفلية جاهزة لحقن سكربت Adsterra -->
    <div class="adsterra-box ad-bottom" id="ad-bottom">
        <div class="ad-title">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الإعلاني هنا مستقبلاً -->
    </div>

    <div class="status" id="status">اختر قناة لفتحها فوراً عبر مشغل ExoPlayer الذكي</div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');

        // جلب قائمة القنوات وعرض شعاراتها ديناميكياً من السيرفر المحدث
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                const playlistDiv = document.getElementById('playlist');
                if(!channels || channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">لم يتم العثور على أي قنوات داخل ملف channels.m3u</div>';
                    return;
                }
                
                playlistDiv.innerHTML = '';
                
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    
                    // صورة بوستر فخمة وافتراضية في حال عدم توفر لوجو في الملف للفيلم/القناة
                    const defaultLogo = 'https://unsplash.com';
                    const currentLogo = channel.logo ? channel.logo : defaultLogo;
                    
                    item.innerHTML = `
                        <div class="channel-info">
                            <img class="channel-logo" src="${currentLogo}" onerror="this.src='${defaultLogo}';">
                            <span class="channel-name">${channel.name}</span>
                        </div>
                        <span class="play-badge">تشغيل ▶</span>
                    `;
                    
                    // تمرير البيانات للمشغل الخارجي (ExoPlayer)
                    item.onclick = () => launchExoPlayer(channel.url, channel.name);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم بنجاح جلب وتأمين ${channels.length} قناة بث حية ومحمية بالكامل.`;
            })
            .catch((err) => {
                console.error(err);
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">عطل في الاتصال بالسيرفر الرئيسي، تأكد من رفع ملف الـ M3U</div>';
            });

        // دالة تحويل وتشغيل البث إجبارياً على مشغل ExoPlayer المتطور
        function launchExoPlayer(url, name) {
            statusText.textContent = `جاري إرسال الإشارة وتشغيل: ${name}...`;
            
            // الرابط المشفر المحمي عبر سيرفر البروكسي الخاص بك لحمايته من السرقة وتوجيهه لإعلاناتك
            const protectedStreamUrl = `${host}/stream?url=${encodeURIComponent(url)}`;
            
            /* 
               🤖 كود الـ Intent المتطور والمعياري المتوافق تماماً مع مشغلات الأندرويد القائمة على ExoPlayer 
               (يقوم برمي البث الخارجي للمشغل ليعمل فوراً بأعلى كفاءة وثبات)
            */
            const intentUri = `intent:${protectedStreamUrl}#Intent;type=video/*;package=com.google.android.exoplayer2.demo;S.title=${encodeURIComponent(name)};end`;
            
            // إطلاق المشغل فوراً
            window.location.href = intentUri;
        }
    </script>
</body>
</html>
