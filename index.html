<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍿 منصة بث قنوات VIP الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #000000; padding: 18px; text-align: center; font-size: 20px; color: #e50914; border-bottom: 2px solid #222; font-weight: bold; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .playlist { width: 100%; background: #181818; overflow-y: auto; padding: 10px; }
        
        /* كروت القنوات الاحترافية */
        .channel-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; background: #2f2f2f; cursor: pointer; transition: all 0.2s ease; border: 1px solid #3c3c3c; }
        .channel-item:hover { background: #3e3e3e; border-color: #e50914; }
        .channel-info { display: flex; align-items: center; gap: 15px; }
        
        /* صورة شعار القناة */
        .channel-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #000; border: 2px solid #e50914; padding: 2px; display: block; }
        .channel-name { font-size: 15px; font-weight: 600; color: #f5f5f7; }
        
        .play-badge { background: #e50914; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status { padding: 14px; background: #000000; text-align: center; font-size: 13px; color: #aaa; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">🍿 منصة قنوات VIP المباشرة</div>
    
    <div class="main-content">
        <div class="playlist" id="playlist">
            <div style="padding:30px; text-align:center; color:#888;">جاري فك تشفير السيرفر وجلب القنوات والشعارات...</div>
        </div>
    </div>
    <div class="status" id="status">انقر على أي قناة لفتحها مباشرة داخل تطبيق MX Player</div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');

        // 1. جلب البيانات والشعارات والأسماء من السيرفر المساعد لـ Render
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                const playlistDiv = document.getElementById('playlist');
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">لا توجد قنوات في ملف M3U</div>';
                    return;
                }
                
                playlistDiv.innerHTML = '';
                
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    
                    const imgLogo = channel.logo ? channel.logo : 'https://lo1.in';
                    
                    item.innerHTML = `
                        <div class="channel-info">
                            <img class="channel-logo" src="${imgLogo}" onerror="this.src='https://lo1.in';">
                            <span class="channel-name">${channel.name}</span>
                        </div>
                        <span class="play-badge">تشغيل ▶</span>
                    `;
                    
                    // نقوم بتمرير رابط القناة الأصلي والمباشر تماماً
                    item.onclick = () => openInMxPlayerDirect(channel.url, channel.name);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم تحديث وبناء واجهة ${channels.length} قناة بنجاح.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">خطأ في الاتصال بالخادم المساعد لـ Render</div>';
            });

        // 2. معالج التمرير المباشر والمحمي لـ MX Player لحل مشكلة توقف البث وقراءة الامتدادات
        function openInMxPlayerDirect(streamUrl, name) {
            statusText.textContent = `جاري تجاوز جدار الحماية وتشغيل القناة: ${name}...`;
            
            // تنظيف الرابط الأصلي المباشر للسيرفر المدفوع الخاص بك
            const cleanUrl = streamUrl.replace(/^https?:\/\//, "");
            
            // الكود الحاسم: نقوم بحقن ترويسة الـ User-Agent الخاصة بـ IPTVSmarters داخل الـ Intent نفسه!
            // هذا الأمر يجبر مشغل MX Player على طلب الرابط من السيرفر بهوية مشغل IPTV رسمي، ليفك السيرفر الحظر فوراً وبدون رندر
            const androidIntent = `intent://${cleanUrl}#Intent;scheme=http;type=video/*;package=com.mxtech.videoplayer.ad;S.title=${encodeURIComponent(name)};S.User-Agent=IPTVSmarters;end`;
            
            // القفز المباشر وتفادي صفحات التحميل أو قيود السيرفر
            window.location.href = androidIntent;
        }
    </script>
</body>
</html>
