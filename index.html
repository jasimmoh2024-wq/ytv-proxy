<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة الأفلام والقنوات الذكية</title>
    
    <!-- استدعاء مشغل ذكي لفك شفرات قنوات الـ Xtream ومنع ترميش الصورة نهائياً -->
    <script src="https://jsdelivr.net"></script>

    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "209100049"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        body { margin: 0; background: #060713; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        .header { background: #111322; padding: 15px; text-align: center; font-size: 18px; color: #00ffff; font-weight: bold; border-bottom: 2px solid #1f233a; text-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        .playlist { width: 35%; max-width: 340px; background: #0b0c16; overflow-y: auto; border-left: 2px solid #1f233a; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        
        .channel-card {
            background: linear-gradient(135deg, #1a1d36, #141628); border: 1px solid #25294a;
            padding: 8px; border-radius: 12px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.2s;
        }
        .channel-card:hover, .channel-card.active { border-color: #00ffff; background: #1f233a; transform: scale(0.97); }
        
        .ch-logo-wrapper { width: 50px; height: 50px; border-radius: 8px; background: #060713; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 24px; border: 1px solid #25294a; }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; }
        .ch-info-box { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .ch-title-name { font-size: 14px; font-weight: bold; color: #ffffff; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-meta-txt { font-size: 10px; color: #00ffcc; text-align: right; margin-top: 3px; }

        .player-area { width: 65%; flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; position: relative; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; background: #000; }
        .status { padding: 12px; background: #111322; text-align: center; font-size: 13px; color: #888; border-top: 2px solid #1f233a; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">🎬 مكتبة السينما والبث المباشر الذكية</div>
    
    <div class="main-content">
        <div class="playlist" id="playlist">
            <div style="padding:20px; text-align:center; color:#888;">جاري سحب مكتبة العروض من السيرفر... ⏳</div>
        </div>
        
        <div class="player-area">
            <div class="video-container" id="videoContainer">
                <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; color:#444;">المشغل جاهز ومستعد</div>
            </div>
            <div class="status" id="status">اختر فيلماً أو قناة من البوستر لبدء العرض الممتع 🍿</div>
        </div>
    </div>

    <script>
        const host = window.location.origin; 
        const videoContainer = document.getElementById('videoContainer');
        const statusText = document.getElementById('status');
        let channelsData = [];
        let activeHls = null;

        // 1. جلب قائمة القنوات والبوسترات
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">مكتبتك فارغة تماماً حالياً</div>';
                    return;
                }
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let hasLogo = channel.logo || channel.tvgLogo || false;
                    let logoVisual = hasLogo ? `<img src="${hasLogo}" class="ch-logo-img">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                            <span class="ch-meta-txt">• عرض عالي الدقة HD</span>
                        </div>
                    `;

                    card.onclick = () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `تم جلب ${channels.length} عرض بنجاح.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">خطأ في جلب البيانات من السيرفر المباشر</div>';
            });

        // 2. المعالج الاحترافي المعدل بالكامل لمنع ترميش قنوات الـ Xtream
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = `جاري الاتصال الآمن بالعرض: ${name} ... 🚀`;
            
            // تفعيل الفخ الإعلاني بأمان عند النقر
            triggerHoneyPotAd();

            // تنظيف الحاوية وإغلاق أي محرك قديم لمنع تداخل الكاش والترميش
            if (activeHls) {
                activeHls.destroy();
                activeHls = null;
            }
            videoContainer.innerHTML = '';

            // إنشاء عنصر فيديو صافي جديد تماماً
            const videoElement = document.createElement('video');
            videoElement.id = 'videoPlayer';
            videoElement.controls = true;
            videoElement.autoplay = true;
            videoElement.setAttribute('playsinline', 'true');
            videoElement.setAttribute('preload', 'auto');
            videoContainer.appendChild(videoElement);

            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;

            // 🌟 الفحص الذكي والحل النهائي: استخدام محرك فك التشفير التلقائي لمنع ترميش القنوات التي بدون امتداد [1.1.6، 2.38K]
            if (!url.toLowerCase().includes('.mp4') && Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                
                // تشغيل مباشر إذا كان m3u8، وعبر البروكسي إذا كان بدون امتداد لترجمته [1.3.2، 2.38K]
                let finalStream = url.toLowerCase().includes('.m3u8') ? url : proxyUrl;
                
                hls.loadSource(finalStream);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoElement.play();
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        // خطة الإنقاذ: إذا حدثت مشكلة في المحرك، يتم إجبار الرابط الخام على العمل مباشرة لـ ExoPlayer
                        videoElement.src = proxyUrl;
                        videoElement.play().catch(() => {});
                    }
                });

                activeHls = hls;
            } else {
                // لتشغيل الأفلام وملفات الـ MP4 الخام مباشرة وبدون ترميش
                videoElement.src = proxyUrl;
                videoElement.play();
            }
            
            videoElement.onplay = () => {
                statusText.textContent = `يعرض الآن: ${name}  ✅`;
            };

            videoElement.onerror = () => {
                videoElement.src = proxyUrl;
                videoElement.play().catch(() => {
                    statusText.textContent = `⚠️ تنبيه البث: سيعمل الفيديو فوراً داخل التطبيق وبمشغل ExoPlayer الأصلي.`;
                });
            };
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        });
    </script>
</body>
</html>
