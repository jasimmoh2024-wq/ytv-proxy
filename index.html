<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص القنوات</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:15px} .log{background:#111;padding:10px;border-radius:8px;margin:10px 0;font-size:12px;white-space:pre-wrap;direction:ltr} video{width:100%;max-height:50vh;background:#000} .card{padding:10px;border:1px solid #333;margin:5px 0;border-radius:6px;cursor:pointer} .card:hover{border-color:#ff003c}</style>
</head>
<body>
<h3 style="color:#ff003c">فحص القنوات - ytv-proxy</h3>
<video id="player" controls autoplay playsinline></video>
<div id="logs" class="log">جاري تحميل القنوات...</div>
<div id="list"></div>
<script>
const API="https://ytv-proxy.onrender.com";
const logEl=document.getElementById('logs'), listEl=document.getElementById('list'), video=document.getElementById('player');
function log(t){ logEl.textContent += "\n" + t; console.log(t); }
let hls=null;

async function load(){
  try{
    let channels = await fetch(API+"/api/channels").then(r=>r.json());
    log(`✅ تم تحميل ${channels.length} قناة`);
    if(channels.length==0){ log("❌ ملف channels.m3u فارغ"); return; }
    let first = channels[0];
    log(`اول قناة: ${first.name}\noriginal: ${first.originalUrl}\nbase64: ${first.url.substring(0,50)}...`);
    
    // اختبر /stream مباشرة
    let testUrl = API + "/stream?url=" + encodeURIComponent(first.url);
    log(`\nجاري اختبار /stream...\n${testUrl}`);
    let testRes = await fetch(testUrl);
    log(`نتيجة /stream: status ${testRes.status} - Content-Type: ${testRes.headers.get('content-type')}`);
    let text = await testRes.clone().text();
    log(`اول 300 حرف من البث:\n${text.substring(0,300)}`);

    // عرض القائمة
    channels.slice(0,20).forEach((ch,i)=>{
      let div=document.createElement('div'); div.className='card';
      div.innerHTML=`${ch.name} <small style="color:#888">${ch.originalUrl.substring(0,60)}</small>`;
      div.onclick=()=>play(ch,i);
      listEl.appendChild(div);
    });
  }catch(e){ log("❌ خطأ: " + e.message); }
}
function play(ch){
  log(`\n▶️ تشغيل: ${ch.name}`);
  let proxyUrl = API + "/stream?url=" + encodeURIComponent(ch.url);
  let directUrl = ch.originalUrl;
  
  // جرب البروكسي اول
  tryPlay(proxyUrl, "بروكسي", ()=>{
    log("⚠️ البروكسي فشل، اجرب المباشر...");
    tryPlay(directUrl, "مباشر", null);
  });
}
function tryPlay(url, type, onFail){
  log(`محاولة ${type}: ${url.substring(0,100)}...`);
  if(hls){ hls.destroy(); hls=null; }
  if(Hls.isSupported()){
    hls=new Hls({debug:false});
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{ log(`✅ ${type} اشتغل!`); video.play(); });
    hls.on(Hls.Events.ERROR,(e,data)=>{ log(`❌ خطأ ${type}: ${data.type} - ${data.details}`); if(data.fatal && onFail) onFail(); });
  } else { video.src=url; video.play().then(()=>log(`✅ ${type} اشتغل`)).catch(e=>{ log(`❌ فشل ${type}: ${e.message}`); if(onFail) onFail(); }); }
}
load();
</script>
</body>
</html>
