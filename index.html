<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TVIQ LIVE</title>

<!-- 1. كود Social Bar - ارباحه ممتازة وما يغطي الفيديو -->
<script type="text/javascript" src="https://www.highperformanceformat.com/31813251/socialbar.js"></script>

<style>
body{margin:0;background:#0a1931;font-family:Arial}
#list{padding:15px;max-width:600px;margin:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:120px}
.header{color:#d4af37;text-align:center;padding:12px;border-bottom:2px solid #d4af37;font-weight:bold}
.card{display:flex;align-items:center;background:#fff;padding:12px;border-radius:12px;cursor:pointer;border:2px solid #d4af37}
.logo{width:55px;height:55px;border-radius:10px;margin-left:12px;background:#0a1931;object-fit:cover}
.name{font-weight:bold;color:#0a1931}
.sub{font-size:11px;color:#666}
.loading{color:#fff;text-align:center;padding:40px}
#box{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;display:none}
#box.show{display:block}
#vid{width:100vw;height:100vh;object-fit:contain;background:#000}
#close{position:absolute;top:12px;right:12px;background:#d4af37;color:#000;border:none;width:38px;height:38px;border-radius:50%;font-size:20px;z-index:100000}
/* بانر ثابت */
#ad-fixed{position:fixed;bottom:0;left:0;width:100%;background:#0a1931;border-top:2px solid #d4af37;text-align:center;z-index:9998;padding:8px 0;min-height:70px;display:flex;justify-content:center;align-items:center;flex-direction:column}
</style>
</head>
<body>

<div class="header">MY TVIQ LIVE</div>
<div id="list"><div class="loading">⏳ جاري جلب القنوات...</div></div>

<!-- 2. كود البانر الثابت جوة -->
<div id="ad-fixed">
  <div style="color:#d4af37;font-size:10px;margin-bottom:4px">إعلان</div>
  <!-- كود البانر 320x50 -->
  <script type="text/javascript">
    atOptions = {
      'key' : '31813462',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script type="text/javascript" src="https://www.highperformanceformat.com/31813462/invoke.js"></script>
</div>

<div id="box">
<button id="close" onclick="closeVid()">✕</button>
<video id="vid" controls autoplay playsinline webkit-playsinline></video>
</div>

<script>
const list=document.getElementById('list');
const box=document.getElementById('box');
const vid=document.getElementById('vid');

// يقرأ من نفس المستودع - بدون رند
async function loadChannels(){
 try{
  let res = await fetch('./channels.json?_=' + Date.now());
  let channels = await res.json();
  list.innerHTML = "";
  channels.forEach(c=>{
   let name = c.name || "قناة";
   let logo = c.logo || "https://via.placeholder.com/55/0a1931/d4af37?text=TV";
   let url = c.url;
   if(!url) return;
   let d=document.createElement('div');
   d.className='card';
   d.innerHTML=`<img class="logo" src="${logo}" onerror="this.src='https://via.placeholder.com/55/0a1931/d4af37?text=TV'"><div><div class="name">${name}</div><div class="sub">اضغط للمشاهدة</div></div>`;
   d.onclick=()=>openVid(url);
   list.appendChild(d);
  });
 }catch(e){
  list.innerHTML = `<div class="loading">❌ ما لكيت ملف channels.json<br>خلي ملف القنوات بنفس المستودع</div>`;
 }
}

function openVid(url){
 // اخفي البانر من يدخل فول سكرين حتى ما يخالف قوانين Adsterra
 document.getElementById('ad-fixed').style.display='none';
 box.classList.add('show');
 vid.src=url;
 vid.play().catch(()=>{});
 if(box.requestFullscreen){ box.requestFullscreen().catch(()=>{}); }
}

function closeVid(){
 box.classList.remove('show');
 vid.pause(); vid.src="";
 document.getElementById('ad-fixed').style.display='flex';
 if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
}

loadChannels();
</script>
</body>
</html>
