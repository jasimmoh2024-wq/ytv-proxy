<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قنوات IPTV</title>
    <style>
        body { margin: 0; background: #0b0b0b; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #141414; padding: 15px; text-align: center; font-size: 18px; color: #38bdf8; border-bottom: 1px solid #222; font-weight: bold; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .playlist { width: 100%; background: #111; overflow-y: auto; }
        .channel-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #1a1a1a; cursor: pointer; transition: 0.2s; font-size: 15px; text-align: right; }
        .channel-item:hover { background: #1c1c1c; color: #38bdf8; }
        .play-badge { background: #38bdf8; color: #000; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .status { padding: 12px; background: #111; text-align: center; font-size: 13px; color: #888; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div class="header">📺 مشغل قنوات Netflix & VIP</div>
    
    <div class="main-content">
        <div class="playlist" id="playlist">
            <div style="padding:20px; text-align:center; color:#888;">جاري جلب القنوات المدفوعة الحية...</div>
        </div>
    </div>
    <div class="status" id="status">اختر قناة لفتحها فوراً في المشغل الخارجي</div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');

        // 1. جلب قائمة القنوات تلقائياً من سيرفر رندر الخاص بك
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                const playlistDiv = document.getElementById('playlist');
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">قائمتك فارغة تماماً</div>';
                    return;
                }
                
                playlistDiv.innerHTML = '';
                
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    
                    item.innerHTML = `
                        <span>📺 ${channel.name}</span>
                        <span class="play-badge">تشغيل MX</span>
                    `;
                    
                    // استدعاء دالة التشغيل الذكية والخارجية
                    item.onclick = () => playChannelExternal(channel.url, channel.name);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم تحميل ${channels.length} قناة بنجاح.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">خطأ في الاتصال بقاعدة القنوات</div>';
            });

        // 2. معالج تشغيل البث عبر سيرفرك وتحويله إجبارياً إلى MX Player
        function playChannelExternal(url, name) {
            statusText.textContent = `جاري تجهيز البث لـ ${name}...`;
            
            // قمنا بالربط مع سيرفر الـ Proxy الخاص بك لتخطي مشاكل الـ CORS بالكامل
            const proxyStreamUrl = `${host}/stream?url=${encodeURIComponent(url)}`;
            
            // قمنا ببناء كود الـ Intent المتوافق مع متصفح الويب لإجبار الأندرويد على رمي البث لمشغل MX
            const cleanProxyUrl = proxyStreamUrl.replace(/^https?:\/\//, "");
            const intentUrl = `android-app://com.mxtech.videoplayer.ad/http/${cleanProxyUrl}`;
            
            // القفز الفوري للمشغل
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
