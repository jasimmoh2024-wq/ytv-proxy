<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مكتبة السينما الاحترافية</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>window.startapp_app_id="209100049";</script>
    <script src="https://startappcdn.com" async></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
        body{font-family:'Tajawal',system-ui;background:#050507;color:#fff;height:100vh;overflow:hidden}
        
        .video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;background:radial-gradient(ellipse at center,#1a1a22 0%,#000 70%)}
        .video-background-container video{width:100%;height:100%;object-fit:contain;background:#000}

        /* زر اظهار القائمة */
        .show-menu-btn{position:fixed;top:20px;right:20px;z-index:10;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s}
        .show-menu-btn:hover{background:rgba(255,0,64,0.2);border-color:#ff0040}
        .show-menu-btn i{font-size:20px;color:#fff}

        .ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:5;display:flex;pointer-events:none}
        
        /* القائمة الجديدة الاحترافية */
        .playlist-container{pointer-events:all;position:absolute;top:0;right:0;width:380px;max-width:85vw;height:100vh;background:rgba(12,12,18,0.92);backdrop-filter:blur(40px) saturate(180%);border-left:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;transition:transform 0.45s cubic-bezier(0.16,1,0.3,1);z-index:6;box-shadow:-20px 0 60px rgba(0,0,0,0.8)}
        .playlist-container.hidden{transform:translateX(100%)}

        .menu-header{padding:22px 18px 14px;background:linear-gradient(180deg,rgba(255,0,64,0.15) 0%,transparent 100%);border-bottom:1px solid rgba(255,255,255,0.06)}
        .menu-title{display:flex;align-items:center;justify-content:space-between}
        .menu-title h2{font-size:20px;font-weight:800;display:flex;gap:10px;align-items:center}
        .menu-title h2 span{color:#ff0040}
        .close-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .status-line{margin-top:10px;font-size:12px;color:#ff4d7a;background:rgba(255,0,64,0.1);border:1px solid rgba(255,0,64,0.15);padding:7px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}

        /* بحث */
        .search-box{margin:14px 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:0 14px;height:44px;transition:0.3s}
        .search-box:focus-within{border-color:rgba(255,0,64,0.4);background:rgba(255,255,255,0.08)}
        .search-box i{color:#888;font-size:14px}
        .search-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Tajawal';font-size:14px}
        .search-box input::placeholder{color:#666}

        /* فلتر */
        .filter-row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
        .filter-row::-webkit-scrollbar{display:none}
        .filter-chip{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);color:#aaa;cursor:pointer;transition:0.25s}
        .filter-chip.active{background:#ff0040;color:#fff;border-color:#ff0040;box-shadow:0 4px 15px rgba(255,0,64,0.3)}

        .playlist{flex:1;overflow-y:auto;padding:0 12px 90px;display:flex;flex-direction:column;gap:8px}
        .playlist::-webkit-scrollbar{width:4px}
        .playlist::-webkit-scrollbar-thumb{background:rgba(255,0,64,0.3);border-radius:10px}

        /* كارت القناة الجديد */
        .channel-card{position:relative;background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.25s ease;overflow:hidden}
        .channel-card:hover{background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,rgba(255,255,255,0.04) 100%);border-color:rgba(255,255,255,0.12);transform:translateX(-4px)}
        .channel-card.active{background:linear-gradient(135deg,rgba(255,0,64,0.25) 0%,rgba(255,0,64,0.08) 100%);border-color:#ff0040;box-shadow:0 8px 25px rgba(255,0,64,0.25)}
        .channel-card.active .ch-logo-wrapper{box-shadow:0 0 0 2px #ff0040}
        
        .ch-logo-wrapper{width:48px;height:48px;min-width:48px;border-radius:12px;background:linear-gradient(135deg,#1a1a22,#0f0f12);overflow:hidden;display:flex;justify-content:center;align-items:center;font-size:20px;border:1px solid rgba(255,255,255,0.06);position:relative}
        .ch-logo-img{width:100%;height:100%;object-fit:cover}
        .live-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;background:#00ff88;border-radius:50%;border:2px solid #0c0c12;box-shadow:0 0 8px #00ff88}

        .ch-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
        .ch-title-name{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .ch-meta{font-size:11px;color:#888;display:flex;gap:8px;align-items:center}
        .ch-meta i{font-size:10px;color:#ff0040}

        .play-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;transition:0.25s}
        .channel-card:hover .play-icon{background:#ff0040;color:#fff}
        .channel-card.active .play-icon{background:#ff0040}

        .video-free-zone{width:100%;height:100vh;cursor:pointer;pointer-events:all}

        #adsterra-banner-fixed{position:fixed;bottom:0;left:0;width:100%;height:50px;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:999999;display:flex;justify-content:center;align-items:center;border-top:1px solid rgba(255,0,64,0.2);}
        
        @media(max-width:600px){
            .playlist-container{width:100%;max-width:100vw}
            .show-menu-btn{top:auto;bottom:70px;right:16px;width:56px;height:56px;border-radius:18px;background:#ff0040;box-shadow:0 8px 25px rgba(255,0,64,0.4)}
        }
    </style>
</head>
<body>
    <div class="video-background-container"><video id="player" controls autoplay playsinline poster=""></video></div>
    
    <div class="show-menu-btn" id="showBtn"><i class="fa-solid fa-bars-staggered"></i></div>

    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="menu-header">
                <div class="menu-title">
                    <h2><i class="fa-solid fa-tv" style="color:#ff0040"></i> مكتبة <span>السينما</span></h2>
                    <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="status-line" id="status"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل...</div>
            </div>

            <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="text" placeholder="ابحث عن قناة، فيلم، مباراة..."></div>
            <div class="filter-row" id="filterRow">
                <div class="filter-chip active" data-filter="الكل">الكل</div>
                <div class="filter-chip" data-filter="رياضة">⚽ رياضة</div>
                <div class="filter-chip" data-filter="افلام">🎬 افلام</div>
                <div class="filter-chip" data-filter="اطفال">👶 اطفال</div>
                <div class="filter-chip" data-filter="مسلسلات">📺 مسلسلات</div>
            </div>

            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>

    <div id="adsterra-banner-fixed"></div>

<script>
    const host = window.location.origin;
    const statusText = document.getElementById('status');
    const playlistContainer = document.getElementById('playlistContainer');
    const freeZone = document.getElementById('freeZone');
    const video = document.getElementById('player');
    const searchInput = document.getElementById('searchInput');
    const filterRow = document.getElementById('filterRow');
    let channelsData = [], filteredData = [], hls = null, wakeLock = null, currentFilter = "الكل";
    let channelClicks = parseInt(localStorage.getItem('ad_clicks') || '0');

    async function requestWakeLock(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
    document.addEventListener('visibilitychange', async()=>{ if(wakeLock!==null && document.visibilityState==='visible') await requestWakeLock(); });
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}

    // نفس البنر - ثابت اسفل - معرفك الاصلي
    let bannerDiv = document.getElementById('adsterra-banner-fixed');
    atOptions = { 'key' : 'a0c5287b15523633a4188d2ccd6d4241', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    let s1 = document.createElement('script');
    s1.src = "https://www.highperformanceformat.com/a0c5287b15523633a4188d2ccd6d4241/invoke.js";
    bannerDiv.appendChild(s1);

    document.getElementById('closeBtn').onclick = ()=> playlistContainer.classList.add('hidden');
    document.getElementById('showBtn').onclick = ()=> playlistContainer.classList.remove('hidden');
    freeZone.onclick = ()=> playlistContainer.classList.remove('hidden');

    // جلب القنوات
    fetch(`${host}/api/channels`).then(r=>r.json()).then(channels=>{
        channelsData=channels;
        filteredData=channels;
        renderChannels(channels);
        statusText.innerHTML = `<i class="fa-solid fa-check" style="color:#00ff88"></i> تم تحميل ${channels.length} قناة`;
    });

    function renderChannels(list){
        const playlistDiv=document.getElementById('playlist');
        playlistDiv.innerHTML='';
        list.forEach((channel, originalIdx)=>{
            const idx = channelsData.indexOf(channel);
            const card=document.createElement('div');
            card.className='channel-card';
            let logoUrl=channel.logo||"";
            let logoVisual=logoUrl?`<img src="${logoUrl}" class="ch-logo-img" onerror="this.parentElement.innerHTML='🎬'"><div class="live-dot"></div>`:`<span>🎬</span>`;
            let category = channel.name.includes('beIN')||channel.name.includes('رياضة')?'رياضة': channel.name.includes('MBC')||channel.name.includes('فلم')?'افلام':'عام';
            card.innerHTML=`
                <div class="ch-logo-wrapper">${logoVisual}</div>
                <div class="ch-info">
                    <span class="ch-title-name">${channel.name}</span>
                    <div class="ch-meta"><i class="fa-solid fa-circle" style="color:#00ff88;font-size:7px"></i> مباشر • ${category}</div>
                </div>
                <div class="play-icon"><i class="fa-solid fa-play" style="font-size:12px;margin-left:2px"></i></div>
            `;
            card.onclick=(e)=>{ e.stopPropagation(); document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); playChannel(idx); };
            playlistDiv.appendChild(card);
        });
    }

    // بحث
    searchInput.addEventListener('input', ()=> applyFilters());
    filterRow.addEventListener('click', (e)=>{
        if(e.target.classList.contains('filter-chip')){
            document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.dataset.filter;
            applyFilters();
        }
    });

    function applyFilters(){
        const q = searchInput.value.toLowerCase();
        filteredData = channelsData.filter(ch=>{
            const matchSearch = ch.name.toLowerCase().includes(q);
            const matchFilter = currentFilter==="الكل" || ch.name.includes(currentFilter) || (currentFilter==="رياضة" && (ch.name.toLowerCase().includes('bein')||ch.name.toLowerCase().includes('sport'))) || (currentFilter==="افلام" && ch.name.toLowerCase().includes('movie'));
            return matchSearch && matchFilter;
        });
        renderChannels(filteredData);
    }

    function playChannel(idx){
        // نفس البار الاعتيادي كل 4 ضغطات - معرفك الاصلي
        channelClicks++;
        localStorage.setItem('ad_clicks', channelClicks);
        if(channelClicks >= 4){
            let s2 = document.createElement('script');
            s2.src = "https://czernik.org/14/2dad716486cfb2031892dd6423eca662/invoke.js";
            document.body.appendChild(s2);
            channelClicks = 0;
            localStorage.setItem('ad_clicks', '0');
        }

        const channel=channelsData[idx];
        statusText.innerHTML = `<i class="fa-solid fa-satellite-dish" style="color:#ff0040"></i> ${channel.name}`;
        playlistContainer.classList.add('hidden');
        requestWakeLock();
        if(typeof startapp!=='undefined'){ try{ startapp.showInterstitial(); }catch(e){} }
        const url=channel.url;
        if(hls){ hls.destroy(); hls=null; }
        if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
        else{ video.src=url; video.play(); }
    }
</script>
</body>
</html>
