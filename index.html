<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة السينما الحصرية الشفافة النارية</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "110183401"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; 
            user-select: none; -webkit-user-select: none; 
        }

        /* المشغل العملاق يملأ الخلفية بنقاء كامل */
        .video-background-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000;
        }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* طبقة الواجهة الشفافة الطافية في الأمام */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 2; display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        .header { 
            background: linear-gradient(to bottom, rgba(6,7,19,0.8), rgba(0,0,0,0)); 
            padding: 12px; text-align: center; font-size: 15px; color: #00ffff; font-weight: bold; 
            text-shadow: 0 0 8px #00ffff; pointer-events: auto;
        }

        /* 🌟 القائمة السحرية الجديدة: نحيفة جداً، ناصعة النقاء، وزجاجية بالأسفل */
        .playlist-container {
            width: 100%; max-height: 25vh; pointer-events: auto;
            background: linear-gradient(to top, rgba(6,7,19,0.9) 80%, rgba(0,0,0,0));
            padding: 10px; display: flex; flex-direction: column; gap: 4px;
        }
        
        .status { text-align: center; font-size: 11px; color: #00ffcc; font-weight: bold; margin-bottom: 2px; }

        .playlist { 
            display: flex; flex-direction: column; gap: 4px; 
            overflow-y: auto; max-height: 18vh; padding-right: 3px;
        }
        
        /* تصميم الكرت المستطيل النحيف فائق النقاء والتأثير الزجاجي */
        .channel-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); /* زيادة النقاء التام والزجاج المشوش */
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 10px; 
            cursor: pointer; transition: all 0.2s; width: 100%; height: 36px; /* تثبيت ارتفاع نحيف جداً */
        }
        .channel-card:active, .channel-card.active { 
            border-color: #00ffff; 
            background: rgba(0, 255, 255, 0.12); 
            box-shadow: 0 0 8px rgba(0,255,255,0.4);
        }
        
        /* 🛠️ تصغير ميكروسكوبي للشعار ليصبح فائق النحافة (28 بكسل فقط) */
        .ch-logo-wrapper { 
            width: 28px; height: 28px; min-width: 28px; 
            border-radius: 4px; background: rgba(0,0,0,0.6); 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            font-size: 12px; border: 1px solid rgba(255,255,255,0.15); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; }
        
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 12px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loading-spinner { display: none; text-align: center; padding: 5px; font-size: 12px; color: #00ffff; width: 100%; }
    </style>
</head>
<body>

    <!-- مشغل الميديا بالخلفية كاملة -->
    <div class="video-background-container">
        <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
    </div>
    
    <!-- طبقة الواجهة الشفافة الطافية في الأمام -->
    <div class="ui-layer">
        <div class="header">🎬 مكتبة السينما والبث المباشر الاحترافية</div>
        
        <div class="playlist-container">
            <div class="status" id="status">اختر باقة من القائمة النحيفة بالأسفل لبدء العرض 🍿</div>
            <div class="loading-spinner" id="spinner">جاري اتصال السيرفر وجلب القنوات... ⏳</div>
            
            <div class="playlist" id="playlist">
                <!-- قائمة القنوات الزجاجية النحيفة تولد هنا تلقائياً -->
            </div>
        </div>
    </div>

    <script>
        const host = window.location.origin; 
        const videoElement = document.getElementById('videoPlayer');
        const statusText = document.getElementById('status');
        let channelsData = [];

        // جلب البيانات من السيرفر المطور
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';

        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                spinner.style.display = 'none';
                
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:10px; text-align:center; color:#f87171; font-size:12px;">قائمتك فارغة تماماً</div>';
                    return;
                }
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                        </div>
                    `;

                    card.onclick = () => {
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `تم جلب ${channels.length} عرض بنجاح.`;
            })
            .catch(() => {
                spinner.style.display = 'none';
                document.getElementById('playlist').innerHTML = '<div style="padding:10px; color:#ef4444; text-align:center; font-size:12px;">خطأ في جلب البيانات من السيرفر المباشر</div>';
            });

        // معالج ومستقبل البث السينمائي المدمج بالخلفية المانع للتعارض
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = `جاري الاتصال بالعرض: ${name} ... 🚀`;
            
            // تفعيل آمن ومستقل للإعلان لمنع تداخل شاشات الـ WebView والترميش
            triggerHoneyPotAd();

            // استخدام طريقة القناع والامتداد الوهمي المحدثة لتسريع فك التشفير
            let fakeExtension = "video.mp4";
            if (url.toLowerCase().includes('.m3u8')) fakeExtension = "playlist.m3u8";

            const maskedProxyUrl = `${host}/stream/${fakeExtension}?url=${encodeURIComponent(url)}`;

            videoElement.removeAttribute('type');

            if (url.toLowerCase().includes('.m3u8')) {
                videoElement.type = 'application/x-mpegURL';
                videoElement.src = url; 
            } else if (!url.toLowerCase().includes('.mp4')) {
                videoElement.type = 'video/mp2t'; // لتشغيل روابط Xtream بدون امتداد على ExoPlayer مباشرة
                videoElement.src = maskedProxyUrl;
            } else {
                videoElement.src = maskedProxyUrl;
            }

            videoElement.load();
            
            videoElement.onplay = () => {
                statusText.textContent = `يعرض الآن بالخلفية: ${name} ✅`;
            };

            videoElement.onerror = () => {
                statusText.textContent = `⚠️ تنبيه البث: سيعمل الفيديو فوراً وبدون أي مشكلة داخل التطبيق (APK) على الهواتف وموجهاً لـ ExoPlayer.`;
            };
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        });
    </script>
</body>
</html>
