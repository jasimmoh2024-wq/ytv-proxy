<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; background:#000; color:#fff; font-family: sans-serif; padding-bottom:60px; }
#player { width:100%; height:40vh; background:#111; }
#channels { padding:10px; }
.channel { padding:12px; border-bottom:1px solid #222; display:flex; align-items:center; cursor:pointer; }
.channel img { width:40px; height:40px; margin-left:10px; }
.channel:hover { background:#222; }
#adsterra-banner-fixed {
  position: fixed; bottom:0; left:0; width:100%; height:50px;
  background:#000; z-index:999999; text-align:center;
  display:flex; justify-content:center; align-items:center;
}
</style>
</head>
<body>

<video id="player" controls autoplay></video>
<div id="channels"></div>
<div id="adsterra-banner-fixed"></div>

<script>
// ===== 1- شغل قائمة القنوات مالك =====
const m3uData = `#EXTM3U
#EXTINF:-1 tvg-name=" SPORTS HD 1" tvg-logo="https://lo1.in/bss/bsS1.png", SPORTS HD 1
http://jbfgrjbn.fhkadvnp.com:80/live/7901885855/7610043061/4014.m3u8
#EXTINF:-1 tvg-name=" SPORTS HD 2" tvg-logo="https://lo1.in/bss/bsS2.png", SPORTS HD 2
http://jbfgrjbn.fhkadvnp.com:80/live/7901885855/7610043061/4013.m3u8
#EXTINF:-1 tvg-name=" SPORTS HD 3" tvg-logo="https://lo1.in/bss/bs3.png", SPORTS HD 3
http://jbfgrjbn.fhkadvnp.com:80/live/7901885855/7610043061/4012.m3u8
`;

const video = document.getElementById('player');
const listDiv = document.getElementById('channels');
let channels = [];
let lines = m3uData.split('\n');
for(let i=0; i<lines.length; i++){
  if(lines[i].includes('#EXTINF')){
    let logo = lines[i].match(/tvg-logo="([^"]+)"/)?.[1] || '';
    let name = lines[i].split(',').pop();
    let url = lines[i+1];
    if(url && url.startsWith('http')) channels.push({name, logo, url});
  }
}
channels.forEach(ch => {
  let div = document.createElement('div');
  div.className = 'channel';
  div.innerHTML = `<img src="${ch.logo}"><span>${ch.name}</span>`;
  div.onclick = () => { video.src = ch.url; video.play(); handleChannelClick(); };
  listDiv.appendChild(div);
});
if(channels[0]){ video.src = channels[0].url; }

// ===== 2- البنر ثابت اسفل =====
let bannerDiv = document.getElementById('adsterra-banner-fixed');
atOptions = { 'key':'a0c5287b15523633a4188d2ccd6d4241', 'format':'iframe', 'height':50, 'width':320, 'params':{} };
let s1 = document.createElement('script');
s1.src = "https://www.highperformanceformat.com/a0c5287b15523633a4188d2ccd6d4241/invoke.js";
bannerDiv.appendChild(s1);

// ===== 3- البار كل 4 ضغطات قناة =====
let clicks = 0;
function handleChannelClick(){
  clicks++;
  if(clicks >= 4){
    let s2 = document.createElement('script');
    s2.setAttribute('data-cfasync','false');
    s2.src = "https://czernik.org/14/2dad716486cfb2031892dd6423eca662/invoke.js";
    document.body.appendChild(s2);
    clicks = 0;
  }
}
</script>
</body>
</html>
