<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة السينما الحصرية الشفافة الصغيرة</title>
    
    <!-- إعلانات Start.io لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "110183401"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <!-- استدعاء مكتبة البث الفولاذية لفك تشفير m3u8 بأعلى ثبات للعتاد -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }

        /* منطقة تشغيل الفيديو: مشغل مدمج فولاذي ثابت */
        .video-background-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #060713; display: flex; justify-content: center; align-items: center; }
        
        #mainVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .welcome-box { position: absolute; z-index: 2; text-align: center; font-size: 13px; color: #555; font-weight: bold; pointer-events: none; }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3; display: flex; flex-direction: row; pointer-events: none; }

        /* القائمة الجانبية الكريستالية الفاخرة المضيئة */
        .playlist-container { 
            width: 18% !important; 
            max-width: 160px !important; 
            min-width: 140px !important; 
            height: 100vh; 
            pointer-events: auto; 
            background: linear-gradient(to left, rgba(6, 7, 19, 0.98) 85%, rgba(0, 0, 0, 0)); 
            padding: 10px 5px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .header { font-size: 11px; color: #00ffff; font-weight: bold; text-align: center; text-shadow: 0 0 6px #00ffff; margin-bottom: 2px; }
        .status { text-align: center; font-size: 8px; color: #00ffcc; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; padding-left: 2px; }
        
        .channel-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3px 6px; border-radius: 5px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; width: 100%; height: 28px;
        }
        .channel-card:active, .channel-card.active { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 6px rgba(0,255,255,0.4); }
        
        .ch-logo-wrapper { 
            width: 22px !important; height: 22px !important; min-width: 22px !important; max-width: 22px !important;
            border-radius: 3px; background: rgba(0,0,0,0.6); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 9px; border: 1px solid rgba(255,255,255,0.12); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 10px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-free-zone { flex: 1; height: 100vh; pointer-events: auto; cursor: pointer; }
    </style>
</head>
<body>

    <!-- مشغل الفيديو المدمج والذكي فك التجميد التلقائي -->
    <div class="video-background-container">
        <div class="welcome-box" id="welcomeBox">اختر قناة لبدء البث الحي 📺</div>
        <video id="mainVideo" controls autoplay playsinline></video>
    </div>
    
    <!-- واجهة التطبيق التكنولوجية المتكاملة -->
    <div class="ui-layer">
        <div class="playlist-container" id="sidebar">
            <div class="header"> Amos TV 🎬</div>
            <div class="status" id="status">جاري التحميل...🍿</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <!-- منطقة حرة للنقر لإخفاء/إظهار القائمة لمشاهدة سينمائية كاملة -->
        <div class="video-free-zone" onclick="toggleSidebar()"></div>
    </div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        const welcomeBox = document.getElementById('welcomeBox');
        const video = document.getElementById('mainVideo');
        let channelsData = [];
        let hls = null;

        // جلب القنوات وسحب البيانات ديناميكياً
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                        </div>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `جاهز لضخ البث.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:10px; color:#ef4444; text-align:center; font-size:10px;">خطأ في جلب السيرفر</div>';
            });

        // تشغيل القناة الحية داخل الـ WebView مباشرة عبر هندسة البروكسي
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = name;
            welcomeBox.style.display = 'none';
            
            triggerHoneyPotAd();

            // تجهيز رابط البروكسي المشفر بالكامل لتخطي CORS وقفل الأندرويد للأمان
            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy(); // تدمير البث السابق لمنع استهلاك الرام والكراش
                
                hls = new Hls({
                    maxBufferLength: 10,
                    liveSyncDuration: 3,
                    enableWorker: true
                });
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {});
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        // محاولة إعادة التشغيل الذاتي الفورية في حال حدوث تقطيع
                        hls.startLoad();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // متصفحات النظام البديلة
                video.src = proxyUrl;
                video.play().catch(() => {});
            }
        }

        // دالة ذكية لإخفاء القائمة الجانبية بنقرة واحدة لتوسيع الشاشة بالكامل
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.style.transform === 'translateX(100%)') {
                sidebar.style.transform = 'translateX(0)';
                sidebar.style.opacity = '1';
            } else {
                sidebar.style.transform = 'translateX(100%)';
                sidebar.style.opacity = '0';
            }
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined' && startapp.showAd) {
                startapp.showAd();
            }
        }
    </script>
</body>
</html>
