<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=any">
    <title>مكتبة السينما الاحترافية الخرافية</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "209100049"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        /* شاشة العرض السينمائية المدمجة ملء الشاشة */
        .video-background-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            background: #060713; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .welcome-box { text-align: center; font-size: 15px; color: #555; font-weight: bold; padding: 20px; }

        /* طبقة الواجهة الشفافة */
        .ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            display: flex; 
        }

        /* 🌟 القائمة الجانبية الأساسية (تأثير الزجاج الكريستالي الشفاف) */
        .playlist-container { 
            position: absolute;
            background: rgba(6, 7, 19, 0.65); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex; 
            flex-direction: column; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 1;
            z-index: 5;
        }

        /* 📱 وضع التدوير التلقائي: الشاشات الأفقية (العرض والتابلت والتلفزيون) */
        @media (orientation: landscape) {
            .ui-layer { flex-direction: row; }
            .playlist-container {
                top: 0;
                right: 0;
                width: 25% !important; 
                max-width: 320px !important; 
                min-width: 240px !important; 
                height: 100vh; 
                padding: 20px 15px; 
                gap: 15px; 
                border-left: 1px solid rgba(255, 255, 255, 0.07);
                transform: translateX(0);
                box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            }
            .playlist-container.hidden {
                transform: translateX(100%);
                opacity: 0;
            }
            .video-free-zone { width: 75%; height: 100vh; margin-right: auto; }
        }

        /* 📱 وضع التدوير التلقائي: الشاشات العمودية (الهاتف المحمول بالطول) */
        @media (orientation: portrait) {
            .ui-layer { flex-direction: column; }
            .playlist-container {
                bottom: 0;
                left: 0;
                width: 100vw !important;
                height: 35vh !important; /* حجم متوسط في أسفل الشاشة */
                padding: 15px 15px 25px 15px; 
                gap: 10px; 
                border-top: 1px solid rgba(255, 255, 255, 0.07);
                transform: translateY(0);
                box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
            }
            .playlist-container.hidden {
                transform: translateY(100%);
                opacity: 0;
            }
            .video-free-zone { width: 100vw; height: 65vh; }
        }
        
        .header { font-size: 16px; color: #00ffff; font-weight: bold; text-align: center; text-shadow: 0 0 10px rgba(0,255,255,0.6); }
        .status { text-align: center; font-size: 11px; color: #00ffcc; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; padding-left: 5px; }
        
        /* تصميم كروت القنوات الاحترافي جداً بصورة خلفية خافتة */
        .channel-card {
            position: relative;
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 12px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            width: 100%; 
            height: 52px;
            overflow: hidden;
        }
        
        .card-bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.12; 
            z-index: 1;
            filter: blur(2px);
            transition: opacity 0.3s ease;
        }
        
        .channel-card-content { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; width: 100%; }
        .channel-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(0, 255, 255, 0.3); }
        .channel-card:active, .channel-card.active { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); box-shadow: 0 0 12px rgba(0,255,255,0.3); }
        .channel-card.active .card-bg-blur { opacity: 0.25; }
        
        .ch-logo-wrapper { 
            width: 34px !important; height: 34px !important; min-width: 34px !important; max-width: 34px !important;
            border-radius: 6px; background: rgba(0,0,0,0.4); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 14px; border: 1px solid rgba(255,255,255,0.15); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 13px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        
        .video-free-zone { pointer-events: auto; cursor: pointer; }
    </style>
</head>
<body>

    <div class="video-background-container" id="fullscreenBg">
        <div class="welcome-box" id="welcomeBox">اضغط على أي مكان فارغ لإظهار القائمة 🍿</div>
    </div>
    
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">اختر باقة 🍿</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        const playlistContainer = document.getElementById('playlistContainer');
        const freeZone = document.getElementById('freeZone');
        const fullscreenBg = document.getElementById('fullscreenBg');
        let channelsData = [];

        // 1. جلب قائمة القنوات وتوليد الكروت الاحترافية مع صور الخلفية
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';
                    
                    // توليد تصميم الكارت مع الصورة الخلفية الخافتة
                    card.innerHTML = `
                        ${logoUrl ? `<img src="\${logoUrl}" class="card-bg-blur" alt="bg">` : ''}
                        <div class="channel-card-content">
                            <div class="ch-logo-wrapper">${logoVisual}</div>
                            <div class="ch-info-box">
                                <span class="ch-title-name">${channel.name}</span>
                            </div>
                        </div>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation(); // منع التداخل مع ضغطات الخلفية العامة
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `جاهز لضخ البث.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:10px; color:#ef4444; text-align:center; font-size:12px;">خطأ في الاتصال بالخادم</div>';
            });

        // 2. معالج تشغيل القناة وإخفاء القائمة تلقائياً عند النقر لملء الشاشة
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            const name = channel.name;

            statusText.textContent = name;
            
            // إخفاء القائمة فوراً لمنح المستخدم تجربة عرض كاملة بدون حواف
            playlistContainer.classList.add('hidden');

            // تفعيل الفخ الإعلاني الذكي لحفظ الأرباح بالدولار
            triggerHoneyPotAd();

            // توجيه الرابط ليفتح تلقائياً داخل المشغل المدمج للنظام
            setTimeout(() => {
                window.location.href = url; 
            }, 250); 
        }

        // 3. السحر الحركي: إظهار القائمة مجدداً عند الضغط على أي منطقة فارغة بالشاشة
        freeZone.onclick = function(e) {
            e.stopPropagation();
            playlistContainer.classList.remove('hidden');
        };

        fullscreenBg.onclick = function(e) {
            e.stopPropagation();
            playlistContainer.classList.remove('hidden');
        };

        // دالة استدعاء إعلانات بينية عند التفاعل الحركي
        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') { startapp.showInterstitial(); }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') { startapp.showInterstitial(); }
        });

        // تحسين متقدم لدعم تدوير الشاشة عبر التحديث الفوري للأبعاد
        window.addEventListener('orientationchange', function() {
            // إعادة ضبط تموضع القائمة عند التدوير لضمان عدم حدوث تجميد بصري
            playlistContainer.classList.remove('hidden'); 
        });
    </script>
</body>
</html>
