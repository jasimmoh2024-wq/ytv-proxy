<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 تطبيق السينما والمستودع الذكي</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151f32;
            --bg-header: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glow-color: rgba(56, 189, 248, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            margin: 0; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* هيدر خرافي احترافي */
        .header { 
            background: linear-gradient(135deg, var(--bg-header), var(--bg-main));
            padding: 20px; 
            text-align: center; 
            font-size: 22px; 
            color: var(--accent-color); 
            border-bottom: 2px solid #223147; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-shadow: 0 0 10px var(--glow-color);
        }
        
        .main-content { 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            overflow: hidden; 
        }
        
        /* منطقة مشغل الفيديو مدمجة بشكل سينمائي غامر */
        .player-area { 
            width: 100%; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            aspect-ratio: 16/9; 
            border-bottom: 2px solid #223147;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            max-height: 265px; 
        }
        
        /* قائمة القنوات المحدثة بشكل بطاقات خرافي */
        .playlist { 
            width: 100%; 
            background: var(--bg-main); 
            overflow-y: auto; 
            padding: 15px; 
            flex: 1; 
        }

        /* تصميم بطاقة فيلم/قناة انسيابي مع تأثير حركي */
        .movie-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            border-radius: 16px; 
            background: var(--bg-card); 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid #223147; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .movie-item:hover { 
            background: #1e2d4a; 
            border-color: var(--accent-color); 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--glow-color);
        }

        .movie-item:active {
            transform: translateY(1px);
        }

        .movie-info { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        
        /* تصميم بوستر طولي احترافي جداً يظهر دائماً */
        .movie-logo { 
            width: 55px; 
            height: 75px; 
            border-radius: 8px; 
            object-fit: cover; 
            background: #111b2b; 
            border: 1px solid #334563; 
            display: block; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .movie-name { 
            font-size: 15px; 
            font-weight: 600; 
            color: #f1f5f9; 
            text-align: right; 
            line-height: 1.5; 
            max-width: 210px; 
        }

        /* زر تشغيل متوهج وعصري */
        .play-badge { 
            background: linear-gradient(135deg, #0ea5e9, #38bdf8); 
            color: #0f172a; 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-size: 12px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
        }

        .movie-item:hover .play-badge {
            background: linear-gradient(135deg, #38bdf8, #7dd3fc);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.6);
        }
        
        /* خانات جاهزة ومعزولة تماماً لحقن إعلانات Adsterra مستقبلاً */
        .adsterra-holder { 
            width: 100%; 
            min-height: 60px;
            text-align: center; 
            background: #05070f; 
            padding: 8px 0; 
            border-bottom: 1px solid #1e293b; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
        }
        .ad-bottom { 
            border-top: 1px solid #1e293b; 
            border-bottom: none; 
        }
        .ad-label {
            color: #475569; 
            font-size: 10px; 
            margin-bottom: 4px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        /* شريط حالة متناسق وسفلي */
        .status { 
            padding: 14px; 
            background: #111827; 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-secondary); 
            border-top: 1px solid #1e293b; 
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">🎬 تطبيق السينما والمستودع الشامل</div>
    
    <!-- مشغل الفيديو السينمائي المدمج (للمعاينة المتوافقة مع ExoPlayer) -->
    <div class="player-area">
        <video id="globalVideoPlayer" controls poster="https://unsplash.com" playsinline preload="auto"></video>
    </div>

    <!-- 🌐 خانة الإعلانات العلوية 1 (جاهزة لحقن سكربت Adsterra هنا) -->
    <div class="adsterra-holder" id="adsterra-top">
        <div class="ad-label">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الخاص بـ Adsterra أسفل هذا السطر مباشرة مستقبلاً -->
        
    </div>

    <div class="main-content">
        <div class="playlist" id="movieList">
            <div style="text-align: center; color: var(--text-secondary); padding: 20px;">جاري الاتصال بالمستودع السحابي وجلب قائمة القنوات...</div>
        </div>
    </div>

    <!-- 🌐 خانة الإعلانات السفلية 2 (جاهزة لحقن سكربت Adsterra هنا) -->
    <div class="adsterra-holder ad-bottom" id="adsterra-bottom">
        <div class="ad-label">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الخاص بـ Adsterra أسفل هذا السطر مباشرة مستقبلاً -->
        
    </div>

    <div class="status" id="statusLabel">جاري تهيئة النظام...</div>

    <script>
        const statusLabel = document.getElementById('statusLabel');
        const videoElement = document.getElementById('globalVideoPlayer');

        /* 
          🛠️ التعديل الجوهري: ربط الرابط تلقائياً بمسار السيرفر الحقيقي الخاص بك (/api/movies)
          حسب الكود الذي أرسلته لي لكي تنتهي مشكلة عدم ظهور القائمة للأبد.
        */
        const RENDER_SERVER_URL = window.location.origin + "/api/movies";

        // دالة بناء القائمة وشعارات الفيديو ديناميكياً
        function renderPlaylist(moviesList, sourceInfo = "سيرفر Render") {
            const playlistDiv = document.getElementById('movieList');
            playlistDiv.innerHTML = '';
            
            if (!moviesList || moviesList.length === 0) {
                playlistDiv.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">القائمة فارغة، تأكد من ملف server.js</div>';
                return;
            }

            moviesList.forEach(movie => {
                const item = document.createElement('div');
                item.className = 'movie-item';
                
                // بوستر حقيقي أنيق يُعرض في حال تعطل رابط اللوجو الأصلي
                const fallbackPoster = 'https://unsplash.com';
                
                /*
                  إصلاح مشكلة عدم ظهور اللوجوهات القديمة: 
                  إذا كان السيرفر يعطي رابط "https://wikimedia.org" غير المباشر، سيقوم الكود باستبداله تلقائياً بشعار فخم وثابت
                */
                let posterImg = movie.logo;
                if (!posterImg || posterImg === "https://wikimedia.org") {
                    posterImg = 'https://unsplash.com';
                }
                
                item.innerHTML = `
                    <div class="movie-info">
                        <img class="movie-logo" src="${posterImg}" onerror="this.src='${fallbackPoster}';">
                        <span class="movie-name">${movie.name}</span>
                    </div>
                    <span class="play-badge">تشغيل ▶</span>
                `;
                
                // عند الضغط يتم تمرير رابط البث الفردي
                item.onclick = () => playGlobalMovie(movie.url, movie.name, posterImg);
                playlistDiv.appendChild(item);
            });
            
            statusLabel.textContent = `تم تحديث المكتبة بنجاح [المصدر: ${sourceInfo}]. عدد العناصر: ${moviesList.length}`;
        }

        // دالة جلب البيانات المباشرة والمتوافقة مع API السيرفر
        async function initApp() {
            statusLabel.textContent = "جاري جلب القنوات من خادم المستودع الرئيسي...";
            try {
                const response = await fetch(RENDER_SERVER_URL);
                if (response.ok) {
                    const serverData = await response.json();
                    renderPlaylist(serverData, "سيرفر Render الحي");
                } else {
                    throw new Error("فشل استجابة السيرفر");
                }
            } catch (err) {
                console.error("خطأ في الاتصال:", err);
                statusLabel.textContent = "تنبيه: تعذر الاتصال بالسيرفر. تأكد من رفع ملف server.js وتشغيل الخدمة على Render.";
                document.getElementById('movieList').innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">فشل تحميل القنوات. يرجى التحقق من تشغيل السيرفر.</div>';
            }
        }

        function playGlobalMovie(videoUrl, name, poster) {
            statusLabel.textContent = `جاري تحضير البث للفيلم: ${name}...`;
            
            // إصلاح الروابط الوهمية القادمة من السيرفر (googleapis.com) لتجربة التشغيل الفوري بنجاح
            let activeUrl = videoUrl;
            if (activeUrl === "https://googleapis.com") {
                activeUrl = "https://googleapis.com";
            }
            
            videoElement.poster = poster;
            videoElement.src = activeUrl;
            videoElement.load();
            
            videoElement.play()
                .then(() => {
                    statusLabel.textContent = `شغال الآن 🍿: ${name}`;
                })
                .catch(() => {
                    statusLabel.textContent = `اضغط على زر التشغيل لبدء عرض: ${name}`;
                });
        }

        // إقلاع النظام وجلب البيانات فوراً عند فتح الصفحة
        initApp();
    </script>
</body>
</html>
