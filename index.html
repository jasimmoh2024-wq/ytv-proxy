<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة السينما الاحترافية الحمراء</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "209100049"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <!-- مكتبات مشغل Plyr.io الحديث ومكتبة تشغيل البث المباشر Hls.js لضمان عمل الروابط على الهواتف -->
    <link rel="stylesheet" href="https://plyr.io" />
    <script src="https://plyr.io"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none; 
            -webkit-user-select: none; 
        }

        /* شاشة العرض السينمائية المدمجة ملء الشاشة المتوافقة مع مشغل Plyr */
        .video-background-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ضبط حجم وحواف مشغل Plyr ليملأ الخلفية تماماً كمنصة سينمائية */
        .video-background-container .plyr {
            width: 100% !important;
            height: 100% !important;
            background: #000;
        }
        .video-background-container video {
            object-fit: contain !important;
        }

        /* تخصيص لون أزرار تحكم مشغل Plyr لتتناسب مع الطابع الأحمر النيون لموقعك */
        :root {
            --plyr-color-main: #ff003c;
            --plyr-video-control-background-hover: rgba(255, 0, 60, 0.2);
        }

        /* طبقة الواجهة الشفافة فوق الفيديو */
        .ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 2; 
            display: flex; 
            flex-direction: row;
            pointer-events: none;
        }

        /* 🌟 القائمة الجانبية الاحترافية: ثابتة عسكرياً على اليمين باللون الأسود والشفافية الزجاجية */
        .playlist-container { 
            position: absolute;
            top: 0;
            right: 0;
            width: 28% !important; 
            max-width: 320px !important; 
            min-width: 180px !important; 
            height: 100vh; 
            background: rgba(10, 10, 15, 0.75); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 20px 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-left: 2px solid rgba(255, 0, 60, 0.2); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 1;
            z-index: 5;
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.8);
            transform: translateX(0);
            pointer-events: auto;
        }

        /* تأثير الاختفاء والانزلاق جهة اليمين */
        .playlist-container.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        /* المنطقة الفارغة المخصصة للمشاهدة ونقر إظهار القائمة */
        .video-free-zone { 
            width: 72%; 
            height: 100vh; 
            margin-right: auto; 
            pointer-events: auto; 
            cursor: pointer; 
        }
        
        /* العناوين باللون الأحمر النيون الفخم */
        .header { 
            font-size: 15px; 
            color: #ff003c; 
            font-weight: bold; 
            text-align: center; 
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.6); 
            letter-spacing: 1px;
        }
        
        .status { 
            text-align: center; 
            font-size: 10px; 
            color: #ff4d73; 
            font-weight: bold; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        
        .playlist { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; padding-left: 2px; }
        
        /* 🎬 تصميم كروت القنوات السوداء الاحترافية مع خلفية الصورة الخافتة */
        .channel-card {
            position: relative;
            background: rgba(20, 20, 25, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            width: 100%; 
            height: 50px;
            overflow: hidden;
        }
        
        .card-bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.1; 
            z-index: 1;
            filter: blur(3px);
            transition: opacity 0.3s ease;
        }
        
        .channel-card-content { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; width: 100%; }
        .channel-card:hover { background: rgba(30, 30, 40, 0.8); border-color: rgba(255, 0, 60, 0.4); }
        .channel-card.active { border-color: #ff003c; background: rgba(255, 0, 60, 0.15); box-shadow: 0 0 12px rgba(255, 0, 60, 0.3); }
        .channel-card.active .card-bg-blur { opacity: 0.22; }
        
        .ch-logo-wrapper { 
            width: 32px !important; height: 32px !important; min-width: 32px !important; max-width: 32px !important;
            border-radius: 6px; background: rgba(0,0,0,0.5); overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); 
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 12px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }
    </style>
</head>
<body>

    <!-- غرفة العرض السينمائية المدمجة تحتوي الآن على مشغل Plyr الاحترافي الداخلي -->
    <div class="video-background-container" id="fullscreenBg">
        <video id="mainVideo" controls playsinline crossorigin></video>
    </div>
    
    <!-- طبقة الواجهة الشفافة الفاخرة جهة اليمين -->
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="header">📺 قائمة القنوات</div>
            <div class="status" id="status">اختر باقة 🍿</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    
    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        const playlistContainer = document.getElementById('playlistContainer');
        const freeZone = document.getElementById('freeZone');
        const videoElement = document.getElementById('mainVideo');
        
        let channelsData = [];
        let wakeLock = null; 
        let hlsPlayer = null;

        // تهيئة وتثبيت مشغل Plyr.io بإعدادات سينمائية كاملة تتناسب مع الهواتف الذكية
        const player = new Plyr(videoElement, {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
            tooltips: { controls: true, seek: true },
            keyboard: { focused: true, global: true },
            i18n: {
                play: 'تشغيل',
                pause: 'إيقاف مؤقت',
                mute: 'كتم الصوت',
                unmute: 'إلغاء كتم الصوت',
                settings: 'الإعدادات',
                fullscreen: 'ملء الشاشة',
                exitFullscreen: 'خروج من ملء الشاشة',
                speed: 'السرعة',
                normal: 'طبيعي',
                quality: 'الجودة'
            }
        });

        // دالة لإبقاء شاشة الهاتف مستيقظة تماماً ومنع النظام من تجميد البث
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock Error: ${err.message}`);
            }
        }

        // إعادة تفعيل قفل استيقاظ الشاشة تلقائياً عند العودة للمتصفح
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // 1. جلب قائمة القنوات وتوليد الكروت بتأثير السينما الأسود والأحمر وخلفية الصورة الخافتة
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';
                    
                    // تم إصلاح كود النصوص ليعمل المتصفح بشكل سليم تماماً وبدون أخطاء رموز أو سلاش زائد
                    card.innerHTML = `
                        ${logoUrl ? `<img src="\${logoUrl}" class="card-bg-blur" alt="bg">` : ''}
                        <div class="channel-card-content">
                            <div class="ch-logo-wrapper">${logoVisual}</div>
                            <div class="ch-info-box">
                                <span class="ch-title-name">${channel.name}</span>
                            </div>
                        </div>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation(); 
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `جاهز لضخ البث.`;
            })
            .catch(() => {
                document.getElementById('playlist').innerHTML = '<div style="padding:10px; color:#ff003c; text-align:center; font-size:11px;">خطأ في الاتصال</div>';
            });

        // 2. معالج تشغيل القناة المحدث بالكامل للعمل داخل مشغل Plyr وتخطي حظر الـ CORS
        function playChannel(idx) {
            const channel = channelsData[idx];
            const originalUrl = channel.url;
            const name = channel.name;
            
            statusText.textContent = name;
            playlistContainer.classList.add('hidden'); 
            
            requestWakeLock(); 
            triggerHoneyPotAd();
            
            // تمرير البث عبر البروكسي الداخلي المدمج في السيرفر لتجنب مشاكل التوقف وحجب المتصفحات
            const playbackUrl = `${host}/stream?url=${encodeURIComponent(originalUrl)}`;

            if (originalUrl.toLowerCase().includes('.m3u8')) {
                if (Hls.isSupported()) {
                    if (hlsPlayer) hlsPlayer.destroy(); 
                    
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(playbackUrl);
                    hlsPlayer.attachMedia(videoElement);
                    hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                        player.play().catch(err => console.log("Auto-play prevented:", err));
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = playbackUrl;
                    player.play().catch(err => console.log("Auto-play prevented:", err));
                }
            } else {
                if (hlsPlayer) hlsPlayer.destroy();
                videoElement.src = playbackUrl;
                player.play().catch(err => console.log("Auto-play prevented:", err));
            }
        }

        freeZone.onclick = function(e) {
            e.stopPropagation();
            playlistContainer.classList.remove('hidden');
        };

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        }

        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        });
    </script>
</body>
</html>
