<body>

    <div class="header">🎬 مستودع قنوات وأفلام Netflix & VIP</div>
    
    <!-- 🌐 مساحة إعلانية علوية جاهزة لحقن سكربت Adsterra مستقبلاً -->
    <div class="adsterra-box" id="ad-top">
        <div class="ad-title">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الإعلاني الخاص بـ Adsterra هنا مستقبلاً -->
    </div>

    <div class="main-content">
        <div class="playlist" id="playlist">
            <div style="padding:20px; text-align:center; color:var(--text-secondary);">جاري سحب الملفات والشعارات من المستودع السحابي...</div>
        </div>
    </div>

    <!-- 🌐 مساحة إعلانية سفلية جاهزة لحقن سكربت Adsterra مستقبلاً -->
    <div class="adsterra-box ad-bottom" id="ad-bottom">
        <div class="ad-title">مساحة إعلانية مأجورة</div>
        <!-- ضع كود الـ Script الإعلاني الخاص بـ Adsterra هنا مستقبلاً -->
    </div>

    <div class="status" id="status">اضغط على زر التحميل لحفظ الملف مباشرة على جهازك</div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');

        // 1. جلب قائمة الملفات وعرض شعاراتها وأسمائها ديناميكياً من السيرفر
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                const playlistDiv = document.getElementById('playlist');
                if(!channels || channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171;">لم يتم العثور على أي ملفات داخل المستودع</div>';
                    return;
                }
                
                playlistDiv.innerHTML = '';
                
                channels.forEach(channel => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    
                    // بوستر سينمائي افتراضي فخم في حال لم يتوفر لوجو للمادة
                    const defaultLogo = 'https://unsplash.com';
                    const currentLogo = channel.logo ? channel.logo : defaultLogo;
                    
                    item.innerHTML = `
                        <div class="channel-info">
                            <img class="channel-logo" src="${currentLogo}" onerror="this.src='${defaultLogo}';">
                            <span class="channel-name">${channel.name}</span>
                        </div>
                        <span class="play-badge" style="background: linear-gradient(135deg, #22c55e, #4ade80); color: #000;">تحميل 📥</span>
                    `;
                    
                    // عند النقر على البطاقة بالكامل أو الزر يتم بدء التنزيل الآمن
                    item.onclick = () => downloadFile(channel.url, channel.name);
                    playlistDiv.appendChild(item);
                });
                statusText.textContent = `تم تحميل القائمة بنجاح. المتوفر الآن: ${channels.length} ملف جاهز للتنزيل.`;
            })
            .catch((err) => {
                console.error(err);
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center;">عطل في الاتصال بالسيرفر، تأكد من رفع كود server.js بنجاح</div>';
            });

        // 🛠️ دالة تحميل الملفات الفورية مع إجبار المرور عبر البروكسي لحقن أرباح إعلاناتك
        function downloadFile(url, name) {
            statusText.textContent = `جاري تحضير رابط تحميل ملف: ${name}...`;
            
            // الرابط يمر إجبارياً عبر سيرفر البروكسي الخاص بك لتفعيل كود إعلانات Adsterra واحتساب الأرباح لك
            const protectedDownloadUrl = `${host}/stream?url=${encodeURIComponent(url)}`;
            
            // بناء عنصر تحميل وهمي لإجبار المتصفح على تنزيل وحفظ الملف فوراً بدلاً من تشغيله
            const link = document.createElement('a');
            link.href = protectedDownloadUrl;
            
            // تسمية الملف تلقائياً باسم الفيلم أو القناة عند تحميله
            link.setAttribute('download', `${name}.mp4`); 
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            statusText.textContent = `بدأ تحميل ملف [ ${name} ] بنجاح!🍿`;
        }
    </script>
</body>
</html>
