<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة السينما</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.highperformanceformat.com/31813251/socialbar.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
.video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1}
video{width:100%;height:100%;object-fit:contain;background:#000}
.ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:2;display:flex}
.playlist-container{position:absolute;top:0;right:0;width:30%;max-width:320px;height:100vh;background:rgba(10,10,15,0.92);padding:20px 12px;display:flex;flex-direction:column;gap:15px;border-left:2px solid #ff003c;transition:0.4s;z-index:5}
.playlist-container.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
.video-free-zone{width:70%;height:100vh;margin-right:auto}
.header{color:#ff003c;font-weight:bold;text-align:center}.status{text-align:center;font-size:11px;color:#ff4d73}
.playlist{display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;padding-bottom:90px}
.channel-card{background:rgba(20,20,25,0.6);border:1px solid rgba(255,255,255,0.05);padding:10px;border-radius:8px;display:flex;align-items:center;gap:12px;cursor:pointer;height:50px}
.channel-card.active{border-color:#ff003c;background:rgba(255,0,60,0.15)}
.ch-logo-wrapper{width:32px;height:32px;min-width:32px;border-radius:6px;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center}
.ch-logo-img{width:100%;height:100%;object-fit:cover}
#ad-fixed{position:fixed;bottom:0;left:0;width:100%;background:rgba(10,10,15,0.95);border-top:2px solid #ff003c;text-align:center;z-index:9999;padding:6px 0;min-height:65px;display:flex;justify-content:center;flex-direction:column}
</style>
</head>
<body>
<div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
<div class="ui-layer">
<div class="playlist-container" id="playlistContainer">
<div class="header">📺 قائمة القنوات</div><div class="status" id="status">جاري التحميل...</div><div class="playlist" id="playlist"></div>
</div><div class="video-free-zone" id="freeZone"></div></div>
<div id="ad-fixed"><div style="color:#ff003c;font-size:9px">إعلان</div>
<script>atOptions={'key':'31813462','format':'iframe','height':50,'width':320,'params':{}};</script>
<script src="https://www.highperformanceformat.com/31813462/invoke.js"></script></div>
<script>
const API="https://ytv-proxy.onrender.com/api/channels";
const statusText=document.getElementById('status'), playlistDiv=document.getElementById('playlist'), playlistContainer=document.getElementById('playlistContainer'), freeZone=document.getElementById('freeZone'), video=document.getElementById('player');
let channelsData=[], hls=null;

fetch(API).then(r=>r.json()).then(channels=>{
  channelsData=channels;
  playlistDiv.innerHTML='';
  channels.forEach((ch,i)=>{
    let card=document.createElement('div'); card.className='channel-card';
    let logo=ch.logo ? `<img src="${ch.logo}" class="ch-logo-img" onerror="this.parentElement.innerHTML='🎬'">` : '🎬';
    card.innerHTML=`<div class="ch-logo-wrapper">${logo}</div><span style="font-size:12px">${ch.name}</span>`;
    card.onclick=()=>{ document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); play(i); };
    playlistDiv.appendChild(card);
  });
  statusText.textContent=`تم تحميل ${channels.length} قناة - اضغط للتشغيل`;
}).catch(()=>{ statusText.textContent="فشل التحميل - حدث الصفحة"; });

function play(i){
  let ch=channelsData[i];
  statusText.textContent=ch.name;
  playlistContainer.classList.add('hidden');
  document.getElementById('ad-fixed').style.display='none';
  let url=ch.url;
  if(hls){ hls.destroy(); hls=null; }
  if(Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
    hls.on(Hls.Events.ERROR,(e,data)=>{ console.log(data); if(data.fatal){ statusText.textContent="هذا المصدر لا يعمل جرب قناة ثانية"; } });
  } else { video.src=url; video.play(); }
}
freeZone.onclick=()=>{ playlistContainer.classList.remove('hidden'); document.getElementById('ad-fixed').style.display='flex'; };
</script>
</body>
</html>
