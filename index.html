<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل البث المباشر</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0c0c0c; color: #fff;
            font-family: Arial, sans-serif; display: flex; justify-content: center;
            align-items: center; height: 100vh; text-align: center;
        }
        .box { padding: 25px; border-radius: 12px; background: #1a1a1a; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .play-btn {
            display: inline-block; background-color: #ff9800; color: #000;
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            text-decoration: none; border-radius: 30px; box-shadow: 0 4px 10px rgba(255,152,0,0.4);
            transition: 0.3s;
        }
        .play-btn:hover { background-color: #e68a00; transform: scale(1.05); }
        p { font-size: 14px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>📡 جاري تحضير رابط البث...</h2>
    <p>اضغط أدناه إذا لم يفتح المشغل تلقائياً</p>
    <br>
    
    <!-- هنا قمنا بتغيير الرابط إلى صيغة فيديو خام تجبر النظام على فتح المشغلات الخارجية -->
    <!-- استبدل الرابط أدناه برابط قناتك المدفوع الحقيقي -->
    <a id="streamLink" class="play-btn" href="https://example.com" type="video/mp4">
        ▶ تشغيل القناة الآن
    </a>
</div>

<script>
    window.onload = function() {
        // محاولة تشغيل تلقائي بعد ثانية واحدة
        setTimeout(function() {
            var url = document.getElementById('streamLink').href;
            
            // هذه الخدعة البرمجية تخبر المتصفح الداخلي بالتخلي عن الرابط ورميه للنظام الخارجي
            var link = document.createElement('a');
            link.href = url;
            link.setAttribute('target', '_blank'); // فتح في نافذة خارجية
            link.click();
        }, 1000);
    };
</script>

</body>
</html>
