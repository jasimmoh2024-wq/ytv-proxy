<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amos TV</title>
    
    <script>window.startapp_app_id = "110183401";</script>
    <script src="https://startappcdn.com" async></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; height: 100vh; overflow: hidden; }
        .video-background-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #060713; display: flex; justify-content: center; align-items: center; }
        #mainVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .welcome-box { position: absolute; z-index: 2; text-align: center; font-size: 14px; color: #666; font-weight: bold; pointer-events: none; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 3; display: flex; flex-direction: row; pointer-events: none; }
        .playlist-container { 
            width: 18% !important; max-width: 160px !important; min-width: 140px !important; height: 100vh; 
            pointer-events: auto; background: linear-gradient(to left, rgba(6, 7, 19, 0.98) 85%, rgba(0, 0, 0, 0)); 
            padding: 10px 5px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header { font-size: 12px; color: #00ffff; font-weight: bold; text-align: center; text-shadow: 0 0 6px #00ffff; }
        .status { text-align: center; font-size: 9px; color: #00ffcc; margin-bottom: 2px; }
        .playlist { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
        .channel-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3px 6px; border-radius: 5px; display: flex; align-items: center; gap: 6px; cursor: pointer; height: 30px;
        }
        .channel-card.active { border-color: #00ffff; background: rgba(0, 255, 255, 0.15); }
        .ch-logo-wrapper { width: 22px; height: 22px; border-radius: 3px; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; font-size: 10px; }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; }
        .ch-info-box { display: flex; flex-direction: column; flex: 1; text-align: right; overflow: hidden; }
        .ch-title-name { font-size: 11px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-free-zone { flex: 1; height: 100vh; pointer-events: auto; cursor: pointer; }
    </style>
</head>
<body>

    <div class="video-background-container">
        <div class="welcome-box" id="welcomeBox">اضغط على القناة لتشغيل البث المباشر 🍿</div>
        <video id="mainVideo" controls autoplay playsinline></video>
    </div>
    
    <div class="ui-layer">
        <div class="playlist-container" id="sidebar">
            <div class="header"> Amos TV 🎬</div>
            <div class="status" id="status">جاري جلب القنوات...</div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" onclick="toggleSidebar()"></div>
    </div>

    <script>
        const host = window.location.origin; 
        const statusText = document.getElementById('status');
        const welcomeBox = document.getElementById('welcomeBox');
        const video = document.getElementById('mainVideo');
        let channelsData = [];
        let hls = null;

        // جلب قائمة باقات القنوات من السيرفر
        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                playlistDiv.innerHTML = '';
                
                if(channels.length === 0) {
                    statusText.textContent = "القائمة فارغة أو الرابط لا يحتوي قنوات";
                    return;
                }

                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.id = `card-${idx}`;
                    
                    let logoVisual = channel.logo ? `<img src="${channel.logo}" class="ch-logo-img" onerror="this.style.display='none'; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box"><span class="ch-title-name">${channel.name}</span></div>
                    `;

                    card.onclick = (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                        playChannel(idx);
                    };
                    playlistDiv.appendChild(card);
                });
                statusText.textContent = `تم تحميل (${channels.length}) قناة بنجاح ✨`;
            })
            .catch((err) => {
                console.error("خطأ في الاتصال بالـ API:", err);
                statusText.textContent = "خطأ في الاتصال بالسيرفر";
            });

        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;
            statusText.textContent = channel.name;
            welcomeBox.style.display = 'none';
            
            if (typeof startapp !== 'undefined' && startapp.showAd) startapp.showAd();

            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=> {}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxyUrl;
                video.play().catch(()=> {});
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
