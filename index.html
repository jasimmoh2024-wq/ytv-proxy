<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة الأفلام والسينما الحصرية</title>
    
    <!-- إعلانات Start.io الفخ الإعلاني المتطور لحفظ أرباحك بالدولار -->
    <script>
        window.startapp_app_id = "110183401"; 
    </script>
    <script src="https://startappcdn.com" async></script>

    <style>
        body { margin: 0; background: #060713; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }
        .header { background: #111322; padding: 15px; text-align: center; font-size: 18px; color: #00ffff; font-weight: bold; border-bottom: 2px solid #1f233a; text-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* مصفوفة البوسترات والشعارات الكرتونية الملونة */
        .playlist { width: 100%; background: #0b0c16; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding-bottom: 60px; }
        
        .channel-card {
            background: linear-gradient(135deg, #1a1d36, #141628); border: 1px solid #25294a;
            padding: 10px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px;
            cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.3); transition: all 0.2s;
        }
        .channel-card:active { border-color: #00ffff; background: #1f233a; transform: scale(0.96); }
        
        /* تصميم البوستر المطور */
        .ch-logo-wrapper { 
            width: 100%; height: 180px; border-radius: 12px; background: #060713; 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            font-size: 45px; border: 1px solid #25294a;
        }
        .ch-logo-img { width: 100%; height: 100%; object-fit: cover; }
        
        .ch-info-box { display: flex; flex-direction: column; width: 100%; text-align: center; }
        .ch-title-name { font-size: 14px; font-weight: bold; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-meta-txt { font-size: 10px; color: #00ffcc; margin-top: 5px; }

        .loading-spinner { display: none; text-align: center; padding: 40px; font-size: 16px; font-weight: bold; color: #00ffff; width: 100%; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">🎬 سينما الأطفال والبث المباشر الذكي</div>
    
    <div class="main-content">
        <div class="loading-spinner" id="spinner">جاري سحب البوسترات والعروض الحصرية... ⏳</div>
        <div class="playlist" id="playlist">
            <!-- شبكة البوسترات السينمائية الملونة تولد هنا تلقائياً -->
        </div>
    </div>

    <script>
        const host = window.location.origin; 
        let channelsData = [];

        // 1. جلب قائمة باقاتك وعرضها بالبوسترات بسرعة الصاروخ
        const spinner = document.getElementById('spinner');
        spinner.style.display = 'block';

        fetch(`${host}/api/channels`)
            .then(res => res.json())
            .then(channels => {
                channelsData = channels;
                const playlistDiv = document.getElementById('playlist');
                spinner.style.display = 'none';
                
                if(channels.length === 0) {
                    playlistDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#f87171; width:100%;">مكتبتك فارغة تماماً حالياً</div>';
                    return;
                }
                playlistDiv.innerHTML = '';
                
                channels.forEach((channel, idx) => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    
                    let logoUrl = channel.logo || "";
                    let logoVisual = logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="logo" onerror="this.src=''; this.parentElement.innerHTML='🎬';">` : '🎬';

                    card.innerHTML = `
                        <div class="ch-logo-wrapper">${logoVisual}</div>
                        <div class="ch-info-box">
                            <span class="ch-title-name">${channel.name}</span>
                            <span class="ch-meta-txt">• اضغط للتشغيل الفوري HD</span>
                        </div>
                    `;

                    card.onclick = () => playChannel(idx);
                    playlistDiv.appendChild(card);
                });
            })
            .catch(() => {
                spinner.style.display = 'none';
                document.getElementById('playlist').innerHTML = '<div style="padding:20px; color:#ef4444; text-align:center; width:100%;">خطأ في جلب البيانات من السيرفر المباشر</div>';
            });

        // 2. معالج التوجيه الذكي والخارق المتوافق مع ExoPlayer والمشغلات الخارجية %100
        function playChannel(idx) {
            const channel = channelsData[idx];
            const url = channel.url;

            // 🌟 القفزة التاريخية: تشغيل الفخ الإعلاني فوراً عند النقر لتأمين أرباحك بالدولار
            triggerHoneyPotAd();

            // تجهيز رابط البروكسي المشفر لسيرفر رندر الخاص بك [2.38K]
            const proxyUrl = `${host}/stream?url=${encodeURIComponent(url)}`;

            // 🚀 الخدعة البرمجية الحتمية لتشغيل الروابط بدون امتداد وقفل التعارض:
            // نقوم بإرسال أمر للنظام لفتح الرابط مباشرة عبر مشغل الهاتف المدمج (ExoPlayer) دون تدخل صفحة الويب المعطلة
            if (url.toLowerCase().includes('.m3u8')) {
                window.location.href = url; // تشغيل قنوات m3u8 بأعلى ثبات
            } else {
                window.location.href = proxyUrl; // توجيه الأفلام وروابط الـ Xtream للعمل على مشغل ExoPlayer للأندرويد فوراً وبدون قيود! [2.38K]
            }
        }

        function triggerHoneyPotAd() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        }

        // فخ صيد السارقين عند النقر العشوائي على الواجهة
        document.addEventListener('click', function() {
            if (typeof startapp !== 'undefined') {
                startapp.showInterstitial();
            }
        });
    </script>
</body>
</html>
