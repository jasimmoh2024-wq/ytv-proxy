<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 تطبيق قائمة القنوات الذكية - ExoPlayer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; background: #0f172a; color: #f8fafc; padding-bottom: 20px; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #1e293b; padding: 18px; text-align: center; font-size: 20px; color: #38bdf8; border-bottom: 2px solid #334155; font-weight: bold; }
        
        .main-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        
        /* منطقة مشغل الفيديو المدمج للـ Web */
        .player-area { width: 100%; background: #000; display: flex; justify-content: center; align-items: center; aspect-ratio: 16/9; border-bottom: 1px solid #334155; }
        video { width: 100%; height: 100%; background: #000; max-height: 240px; }
        
        /* قائمة القنوات المحدثة */
        .playlist { width: 100%; background: #0f172a; overflow-y: auto; padding: 12px; flex: 1; }
        .movie-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; background: #1e293b; cursor: pointer; transition: all 0.2s ease; border: 1px solid #334155; }
        .movie-item:hover { background: #2d3748; border-color: #38bdf8; }
        .movie-info { display: flex; align-items: center; gap: 15px; }
        
        /* تصميم شعار القناة / الفيلم */
        .movie-logo { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; background: #111; border: 1px solid #475569; display: block; }
        .movie-name { font-size: 14px; font-weight: 600; color: #f1f5f9; text-align: right; line-height: 1.4; max-width: 200px; }
        .play-badge { background: #38bdf8; color: #0f172a; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        /* حاويات إعلانات Adsterra المعزولة */
        .ad-container { width: 100%; text-align: center; background: #000; padding: 6px 0; border-bottom: 1px solid #334155; display: flex; justify-content: center; align-items: center; }
        .ad-bottom { border-top: 1px solid #334155; border-bottom: none; }
        
        .status { padding: 14px; background: #1e293b; text-align: center; font-size: 13px; color: #94a3b8; border-top: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="header">🎬 مستودع القنوات الذكي (ExoPlayer Stream)</div>
    
    <!-- مشغل الفيديو المدمج لمعاينة البث -->
    <div class="player-area">
        <video id="globalVideoPlayer" controls poster="https://unsplash.com" playsinline preload="auto"></video>
    </div>

    <!-- 1. المساحة الإعلانية العلوية لشبكة Adsterra -->
    <div class="ad-container" id="ad-top">
        <span style="color:#475569; font-size:11px;">مساحة إعلانية مأجورة</span>
    </div>

    <div class="main-content">
        <div class="playlist" id="movieList">
            <!-- سيتم تحميل البيانات هنا فوراً -->
        </div>
    </div>

    <!-- 2. المساحة الإعلانية السفلية لشبكة Adsterra -->
    <div class="ad-container ad-bottom" id="ad-bottom">
        <span style="color:#475569; font-size:11px;">مساحة إعلانية مأجورة</span>
    </div>

    <div class="status" id="statusLabel">جاري جلب القنوات الذكية...</div>

    <script>
        const statusLabel = document.getElementById('statusLabel');
        const videoElement = document.getElementById('globalVideoPlayer');
        
        // ⚠️ استبدل هذا الرابط برابط سيرفر Render الفعلي الخاص بك بعد تشغيله تماماً
        const RENDER_SERVER_URL = "https://onrender.com"; 

        // القائمة الاحتياطية المدمجة لضمان ظهور القنوات فوراً ولا ينتظر المستخدم استيقاظ السيرفر
        const localBackupChannels = [
            {
                name: "قناة الأنمي والمغامرة الكوميدي - Big Buck Bunny",
                logo: "https://wikimedia.org",
                url: "https://googleapis.com"
            },
            {
                name: "قناة الخيال العلمي القصير - Sintel",
                logo: "https://wikimedia.org",
                url: "https://googleapis.com"
            },
            {
                name: "قناة الرسوم المتحركة والدراما - Tears of Steel",
                logo: "https://wikimedia.org",
                url: "https://googleapis.com"
            }
        ];

        // دالة بناء وعرض عناصر القائمة بالـ HTML
        function displayChannels(channels, isServerSource = false) {
            const playlistDiv = document.getElementById('movieList');
            playlistDiv.innerHTML = '';
            
            channels.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'movie-item';
                
                const posterImg = channel.logo ? channel.logo : 'https://unsplash.com';
                
                item.innerHTML = `
                    <div class="movie-info">
                        <img class="movie-logo" src="${posterImg}" onerror="this.src='https://unsplash.com';">
                        <span class="movie-name">${channel.name}</span>
                    </div>
                    <span class="play-badge">بث ▶</span>
                `;
                
                item.onclick = () => playGlobalMovie(channel.url, channel.name, posterImg);
                playlistDiv.appendChild(item);
            });

            if (isServerSource) {
                statusLabel.textContent = `مستصل بالسيرفر الحي 📡. تم تحديث ${channels.length} قناة بنجاح.`;
            } else {
                statusLabel.textContent = `يعمل بالوضع الاحتياطي (سيرفر Render مستيقظ قريباً...).`;
            }
        }
        
        // دالة جلب البيانات الذكية التي تدمج التزامن بين المحلي والسيرفر خارجي
        async function fetchChannels() {
            // خطوة 1: اعرض القائمة المحلية فوراً بدون أي تأخير
            displayChannels(localBackupChannels, false);

            // خطوة 2: حاول سحب البيانات المحدثة من سيرفر Render بالخلفية
            try {
                // نضع مهلة زمنية 8 ثواني وإذا لم يستجب السيرفر نبقى على القائمة المحلية
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(RENDER_SERVER_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const serverChannels = await response.json();
                    if (serverChannels && serverChannels.length > 0) {
                        // تحديث القائمة فوراً بالبيانات الحية القادمة من السيرفر
                        displayChannels(serverChannels, true);
                    }
                }
            } catch (error) {
                console.log("السيرفر حالياً قيد الاستيقاظ أو لم يتم ربط الرابط بعد. مستمر بالوضع المحلي الآمن.");
            }
        }

        function playGlobalMovie(videoUrl, name, poster) {
            statusLabel.textContent = `جاري تشغيل القناة: ${name}...`;
            
            videoElement.poster = poster;
            videoElement.src = videoUrl;
            videoElement.load();
            
            videoElement.play()
                .then(() => {
                    statusLabel.textContent = `بث حي الآن 📡: ${name}`;
                })
                .catch(() => {
                    statusLabel.textContent = `اضغط تشغيل لبدء بث: ${name}`;
                });
        }

        // تشغيل البناء الفوري عند الإقلاع
        fetchChannels();
    </script>
</body>
</html>
