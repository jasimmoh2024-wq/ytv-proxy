<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة السينما</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>window.startapp_app_id="209100049";</script>
    <script src="https://startappcdn.com" async></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:'Tajawal';background:#000;color:#fff;height:100vh;overflow:hidden}
        .video-background-container{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;background:#000}
        .video-background-container video{width:100%;height:100%;object-fit:contain;background:#000}
        .show-menu-btn{position:fixed;top:20px;right:20px;z-index:10;background:#ff0040;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 15px rgba(255,0,64,0.4)}
        .ui-layer{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:5;display:flex;pointer-events:none}
        /* القائمة فاتحة */
        .playlist-container{pointer-events:all;position:absolute;top:0;right:0;width:410px;max-width:92vw;height:100vh;background:#f5f5f7;display:flex;flex-direction:column;transition:transform 0.4s ease;z-index:6;box-shadow:-20px 0 50px rgba(0,0,0,0.5)}
        .playlist-container.hidden{transform:translateX(100%)}
        .menu-header{padding:18px 14px 10px;background:#fff;border-bottom:1px solid #e5e5e5}
        .menu-title{display:flex;justify-content:space-between;align-items:center}
        .menu-title h2{font-size:20px;font-weight:800;color:#111;display:flex;gap:8px;align-items:center}
        .menu-title h2 span{color:#ff0040}
        .close-btn{width:34px;height:34px;border-radius:10px;background:#f0f0f0;border:none;color:#111;cursor:pointer}
        .status-line{margin-top:10px;font-size:12px;color:#fff;background:#111;padding:6px 12px;border-radius:20px;display:inline-flex;gap:6px}
        .playlist{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#f5f5f7}
        /* كارد القناة فاتح وواضح */
        .channel-card{background:#fff;border:1px solid #e8e8e8;padding:12px;border-radius:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .channel-card:hover{border-color:#ff0040;transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.08)}
        .channel-card.active{background:#111;border-color:#111;box-shadow:0 8px 20px rgba(0,0,0,0.2)}
        .channel-card.active .ch-title-name{color:#fff}
        .channel-card.active .ch-meta{color:#aaa}
        .ch-logo-wrapper{width:64px;height:64px;min-width:64px;border-radius:14px;background:#fff;border:1px solid #eee;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:6px;position:relative}
        .ch-logo-img{width:100%;height:100%;object-fit:contain}
        .ch-info{flex:1;min-width:0}
        .ch-title-name{font-size:15px;font-weight:800;color:#111;line-height:1.4;white-space:normal !important;overflow:visible !important;display:block;word-break:break-word}
        .ch-meta{font-size:11px;color:#777;margin-top:4px;display:flex;gap:6px;align-items:center}
        .badge-live{background:#00c853;color:#fff;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700}
        .play-icon{width:38px;height:38px;min-width:38px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#111}
        .channel-card.active .play-icon{background:#ff0040;color:#fff}
        .video-free-zone{width:100%;height:100vh;pointer-events:all}
        #adsterra-banner-fixed{position:fixed;bottom:0;left:0;width:100%;height:50px;background:rgba(0,0,0,0.95);z-index:9999;display:flex;justify-content:center;align-items:center}
        @media(max-width:600px){.playlist-container{width:100%}.show-menu-btn{top:auto;bottom:70px;right:16px;width:56px;height:56px;border-radius:18px;background:#ff0040}}
    </style>
</head>
<body>
    <div class="video-background-container"><video id="player" controls autoplay playsinline></video></div>
    <div class="show-menu-btn" id="showBtn"><i class="fa-solid fa-bars-staggered" style="color:#fff"></i></div>
    <div class="ui-layer">
        <div class="playlist-container" id="playlistContainer">
            <div class="menu-header">
                <div class="menu-title"><h2><i class="fa-solid fa-tv" style="color:#ff0040"></i> مكتبة <span>السينما</span></h2><button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="status-line" id="status">جاري التحميل...</div>
            </div>
            <div class="playlist" id="playlist"></div>
        </div>
        <div class="video-free-zone" id="freeZone"></div>
    </div>
    <div id="adsterra-banner-fixed"></div>
<script>
    const host = window.location.origin;
    const statusText = document.getElementById('status');
    const playlistContainer = document.getElementById('playlistContainer');
    const video = document.getElementById('player');
    let channelsData = [], hls = null;

    let bannerDiv = document.getElementById('adsterra-banner-fixed');
    let atOptions = { 'key' : 'a0c5287b15523633a4188d2ccd6d4241', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    let s1 = document.createElement('script'); s1.src = "https://www.highperformanceformat.com/a0c5287b15523633a4188d2ccd6d4241/invoke.js"; bannerDiv.appendChild(s1);

    document.getElementById('closeBtn').onclick = ()=> playlistContainer.classList.add('hidden');
    document.getElementById('showBtn').onclick = ()=> playlistContainer.classList.remove('hidden');
    document.getElementById('freeZone').onclick = ()=> playlistContainer.classList.remove('hidden');

    fetch(`${host}/api/channels`).then(r=>r.json()).then(channels=>{
        channelsData=channels;
        const playlistDiv=document.getElementById('playlist');
        playlistDiv.innerHTML='';
        channels.forEach((channel,idx)=>{
            const card=document.createElement('div'); card.className='channel-card';
            let logoUrl=channel.logo||"";
            let logoVisual=logoUrl?`<img src="${logoUrl}" class="ch-logo-img" loading="lazy" onerror="this.parentElement.innerHTML='⚽'">`:'⚽';
            card.innerHTML=`
                <div class="ch-logo-wrapper">${logoVisual}</div>
                <div class="ch-info">
                    <span class="ch-title-name">${channel.name}</span>
                    <div class="ch-meta"><span class="badge-live">LIVE</span> HD • مباشر</div>
                </div>
                <div class="play-icon"><i class="fa-solid fa-play" style="font-size:12px"></i></div>
            `;
            card.onclick=()=>{ document.querySelectorAll('.channel-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); playChannel(idx); };
            playlistDiv.appendChild(card);
        });
        statusText.innerHTML = `تم تحميل ${channels.length} قناة ✓`;
    });

    function playChannel(idx){
        const channel=channelsData[idx];
        statusText.innerHTML = channel.name;
        playlistContainer.classList.add('hidden');
        if(hls){ hls.destroy(); hls=null; }
        if(Hls.isSupported()){ hls=new Hls(); hls.loadSource(channel.url); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play()); }
        else{ video.src=channel.url; video.play(); }
    }
</script>
</body>
</html>
