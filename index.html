<style>
#player-container { position:relative; width:100%; height:40vh; background:#000; }
#player { width:100%; height:100%; }
#controls { position:absolute; bottom:10px; right:10px; z-index:10; display:flex; gap:8px; }
#controls button { background:rgba(0,0,0,0.7); color:#fff; border:1px solid #fff; padding:6px 12px; border-radius:6px; font-size:14px; }
#adsterra-banner-fixed {
  position: fixed; bottom:0; left:0; width:100%; height:50px;
  background:#000; z-index:999999; text-align:center;
  display:flex; justify-content:center; align-items:center;
}
body { margin:0; background:#000; color:#fff; padding-bottom:60px; }
.channel { padding:12px; border-bottom:1px solid #222; display:flex; align-items:center; cursor:pointer; }
.channel img { width:40px; height:40px; margin-left:10px; }
</style>

<div id="player-container">
  <video id="player" controls autoplay playsinline></video>
  <div id="controls">
    <button onclick="toggleFullscreen()">⛶ ملئ الشاشة</button>
    <button onclick="rotateScreen()">↻ تدوير</button>
  </div>
</div>

<div id="channels"></div>
<div id="adsterra-banner-fixed"></div>

<script>
// ===== مشغل مع ملئ شاشة وتدوير =====
const video = document.getElementById('player');
const container = document.getElementById('player-container');

function toggleFullscreen(){
  if (!document.fullscreenElement) {
    if(container.requestFullscreen) container.requestFullscreen();
    else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  } else {
    document.exitFullscreen();
  }
}

function rotateScreen(){
  if(screen.orientation && screen.orientation.lock){
    if(screen.orientation.type.includes('portrait')){
      screen.orientation.lock('landscape').catch(()=>{});
      container.style.height = '100vh';
    } else {
      screen.orientation.lock('portrait').catch(()=>{});
      container.style.height = '40vh';
    }
  } else {
    // للاجهزة القديمة
    if(container.style.height === '100vh'){ container.style.height='40vh'; }
    else { container.style.height='100vh'; }
  }
}

// ===== البنر ثابت اسفل =====
let bannerDiv = document.getElementById('adsterra-banner-fixed');
atOptions = { 'key':'a0c5287b15523633a4188d2ccd6d4241', 'format':'iframe', 'height':50, 'width':320, 'params':{} };
let s1 = document.createElement('script');
s1.src = "https://www.highperformanceformat.com/a0c5287b15523633a4188d2ccd6d4241/invoke.js";
bannerDiv.appendChild(s1);

// ===== البار كل 4 ضغطات =====
let clicks = 0;
window.handleChannelClick = function(){
  clicks++;
  if(clicks >= 4){
    let s2 = document.createElement('script');
    s2.setAttribute('data-cfasync','false');
    s2.src = "https://czernik.org/14/2dad716486cfb2031892dd6423eca662/invoke.js";
    document.body.appendChild(s2);
    clicks = 0;
  }
}

// ===== تحميل قنواتك (نفس قائمتك) =====
const channels = [
  {name:"SPORTS HD 1", logo:"https://lo1.in/bss/bsS1.png", url:"http://jbfgrjbn.fhkadvnp.com:80/live/7901885855/7610043061/4014.m3u8"},
  {name:"SPORTS HD 2", logo:"https://lo1.in/bss/bsS2.png", url:"http://jbfgrjbn.fhkadvnp.com:80/live/7901885855/7610043061/4013.m3u8"}
  // كمل باقي القنوات هنا
];
const listDiv = document.getElementById('channels');
channels.forEach(ch=>{
  let div = document.createElement('div');
  div.className='channel';
  div.innerHTML=`<img src="${ch.logo}"><span>${ch.name}</span>`;
  div.onclick=()=>{ video.src=ch.url; video.play(); handleChannelClick(); };
  listDiv.appendChild(div);
});
if(channels[0]) video.src=channels[0].url;
</script>
